  /api/admin/notifications:
    get:
      tags:
        - "Notifications (admin)"
      summary: "Notification history"
      description: |-
        **Roles:** `admin, super_admin`

        Lists the notifications for the administration panel (history), paginated and ordered by date. Unlike `GET NOTIFICATIONS`, it returns the terminal, the type and whether it expired, and includes expired ones by default.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Query params:**
        | Param | Type | Required | Description |
        |---|---|---|---|
        | `page` | int | No | Page number, starts at 1 (default: `1`) |
        | `limit` | int | No | Items per page (default: `10`, maximum: `100`) |
        | `order` | string | No | Order by date: `ASC` or `DESC` (default: `DESC`; any other value is treated as `DESC`) |
        | `type` | string | No | `BUS_ARRIVAL`, `BUS_DELAY`, `LOCAL`, `GLOBAL` or `CAMERA` (case-insensitive) |
        | `terminal_uuid` | UUID | No | Filters by terminal (includes the plate+terminal ones) |
        | `status` | string | No | `active` (current), `expired` or `all` / empty (all, default) |

        **Internal behavior by role:**
        - **`super_admin`:** All notifications, including `GLOBAL` ones. With `terminal_uuid`, only those of that terminal.
        - **`admin`:** Only those of their terminals (includes `CAMERA`, does not include `GLOBAL`). If they pass `terminal_uuid` it must be theirs (`403`). If they have no terminals returns `400`.

        **Successful response `200 OK`:**
        ```json
        {
          "notifications": [
            {
              "id": "98fb4a77-0a0f-44f0-8067-59e5b7df42ba",
              "type": "LOCAL",
              "terminal": { "uuid": "a0000000-0000-0000-0000-000000000001", "name": "TERMINAL GUALEGUAYCHU" },
              "date": "2026-05-04T15:18:00Z",
              "expiration": "2026-05-04T15:30:00Z",
              "expired": true,
              "payload": { "id": "98fb4a77-0a0f-44f0-8067-59e5b7df42ba", "message": "Text", "time_life": 12 }
            }
          ],
          "page": 1,
          "next": null,
          "prev": null,
          "elements": 1,
          "total_elements": 1
        }
        ```

        `terminal` is `null` in `GLOBAL` notifications. **Pagination:** `next` and `prev` are the number of the next/previous page, or `null` if there is none. `elements` is the number of items returned in this page and `total_elements` the unpaginated total. Invalid `page`/`limit` values are ignored and the defaults are used.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Invalid `type` or `status`, `terminal_uuid` is not a UUID, admin with no assigned terminal |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | `terminal_uuid` does not belong to the admin, or role not allowed |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_notifications"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Order"
        - name: "type"
          in: "query"
          required: false
          description: "Notification type (case-insensitive)."
          schema:
            $ref: "#/components/schemas/NotificationType"
        - name: "terminal_uuid"
          in: "query"
          required: false
          description: "Filters by terminal."
          schema:
            type: "string"
            format: "uuid"
        - name: "status"
          in: "query"
          required: false
          description: "Notification status."
          schema:
            type: "string"
            enum:
              - "active"
              - "expired"
              - "all"
            default: "all"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminNotificationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - "Notifications (admin)"
      summary: "Send LOCAL or GLOBAL notification"
      description: |-
        **Roles:** `admin, super_admin`

        Sends a manual notification to passengers. Supports the `LOCAL` (a specific terminal) and `GLOBAL` (every terminal, `super_admin` only) types.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Query params:**
        | Param | Type | Required | Description |
        |---|---|---|---|
        | `terminaluuid` | UUID | Conditional | Target terminal (`LOCAL` only). Required for `super_admin` and for `admin` with more than one terminal |

        **Body (JSON) — LOCAL type:**
        ```json
        {
          "type": "LOCAL",
          "payload": {
            "message": "Message text",
            "time_life": 12
          }
        }
        ```

        **Body (JSON) — GLOBAL type** (`super_admin` only, `terminaluuid` is ignored):
        ```json
        {
          "type": "GLOBAL",
          "payload": {
            "message": "Message text",
            "time_life": 12
          }
        }
        ```

        | Field | Type | Required | Description |
        |---|---|---|---|
        | `type` | string | Yes | `LOCAL` or `GLOBAL` |
        | `payload.message` | string | Yes | Notification text |
        | `payload.time_life` | integer | Yes | Notification lifetime in minutes (> 0) |

        In `GLOBAL` the payload can have extra fields, which are forwarded as-is. In `LOCAL` only `message` and `time_life` are used. In both cases the backend adds `payload.id` with the notification UUID.

        **Internal behavior by type:**
        - **`LOCAL`:** Determines the target terminal according to the role. If the admin has a single terminal and `terminaluuid` is not passed, it uses that one (if passed, it must be that same one: `403`). If they have several, `terminaluuid` is mandatory and must be theirs. Persists the notification (`group_key = terminal_uuid`) and sends it via SignalR (`SendToFrontend`) to the `frontend/{terminal_uuid}` group.
        - **`GLOBAL`:** Persists the notification with a null `group_key` and sends it via SignalR (`SendToFrontendGlobal`) to the `frontend/global` group.

        **Successful response `200 OK`:**
        ```json
        {
          "message": "notification sent"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Invalid type, empty / non-JSON payload, empty message, invalid `time_life`, missing or invalid `terminaluuid`, admin with no assigned terminal |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | Admin tries to send a `GLOBAL` notification, or `terminaluuid` does not belong to them |
        | `404 Not Found` | Terminal not found |
        | `502 Bad Gateway` | Error persisting or sending the notification via SignalR |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_admin_notifications"
      security:
        - bearerAuth: []
      parameters:
        - name: "terminaluuid"
          in: "query"
          required: false
          description: "Target terminal (`LOCAL` only). Required for `super_admin` and for `admin` with more than one terminal."
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000002"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSendNotificationRequest"
            examples:
              LOCAL:
                value:
                  type: "LOCAL"
                  payload:
                    message: "Sample LOCAL message"
                    time_life: 12
              GLOBAL:
                value:
                  type: "GLOBAL"
                  payload:
                    message: "Sample GLOBAL message"
                    time_life: 12
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "notification sent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      tags:
        - "Notifications (admin)"
      summary: "Delete notification"
      description: |-
        **Roles:** `admin, super_admin`

        Deletes a notification from the system and removes it from the frontend in real time via SignalR.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Query params:**
        | Param | Type | Required | Description |
        |---|---|---|---|
        | `notification_id` | UUID | Yes | ID of the notification to delete |

        **Body:** None.

        **Internal behavior by role:**
        - **`super_admin`:** Can delete any notification. Looks it up, sends the `DeleteNotification(id, group_name)` event via SignalR and deletes it from the DB.
        - **`admin`:** Can only delete notifications of their terminals (including `CAMERA` and plate+terminal ones). Cannot delete `GLOBAL` notifications (null `group_key`). Checks that the `group_key` contains the UUID of one of their terminals; otherwise returns `403`.

        If sending via SignalR fails, the notification is **not** deleted.

        **Successful response `204 No Content`:** No body.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | `notification_id` missing or with an invalid UUID format, admin with no assigned terminal |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | Role not allowed, `GLOBAL` notification an `admin` tried to delete, or notification of another terminal |
        | `404 Not Found` | Notification not found |
        | `500 Internal Server Error` | Internal error or error sending the event via SignalR |
      operationId: "delete_api_admin_notifications"
      security:
        - bearerAuth: []
      parameters:
        - name: "notification_id"
          in: "query"
          required: true
          description: "ID of the notification to delete"
          schema:
            type: "string"
            format: "uuid"
          example: "98fb4a77-0a0f-44f0-8067-59e5b7df42ba"
      responses:
        "204":
          description: "No content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/notifications/{id}:
    get:
      tags:
        - "Notifications (admin)"
      summary: "Get notification"
      description: |-
        **Roles:** `admin, super_admin`

        Returns a notification by its ID, with the same format as the `LIST NOTIFICATIONS (ADMIN)` items.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `id` | UUID | Notification ID |

        **Internal behavior by role:**
        - **`super_admin`:** Any notification.
        - **`admin`:** Only those of their terminals. If it is `GLOBAL` or from another terminal returns `404` (does not reveal that it exists).

        **Successful response `200 OK`:**
        ```json
        {
          "id": "98fb4a77-0a0f-44f0-8067-59e5b7df42ba",
          "type": "BUS_DELAY",
          "terminal": { "uuid": "a0000000-0000-0000-0000-000000000001", "name": "TERMINAL GUALEGUAYCHU" },
          "date": "2026-05-04T15:18:00Z",
          "expiration": "2026-05-04T15:30:00Z",
          "expired": false,
          "payload": { "id": "98fb4a77-0a0f-44f0-8067-59e5b7df42ba", "license_plate": "AB 123 CD", "time_delay": 15, "time_life": 12 }
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | `id` is not a valid UUID |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user does not have role `admin` or `super_admin` |
        | `404 Not Found` | Notification does not exist or is not visible to the admin |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_notifications_id"
      security:
        - bearerAuth: []
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Notification ID"
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/notify-bus-delay:
    post:
      tags:
        - "Notifications (admin)"
      summary: "Notify bus delay"
      description: |-
        **Roles:** `admin, super_admin`

        Notifies the passengers of a terminal that a specific bus is delayed. Before sending, it checks with the terminals backend that the trip is registered for that date and license plate.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        The tests script automatically retries the request if it gets `401`, renewing the token with `REFRESH`.

        **Body (JSON):**

        ```json
        {
          "type": "BUS_DELAY",
          "license_plate": "AB 123 CD",
          "uuid_terminal": "a0000000-0000-0000-0000-000000000001",
          "start_date": "2026-04-27",
          "payload": {
            "time_delay": 15,
            "time_life": 12
          }
        }
        ```

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | `type` | string | Yes | Must be `BUS_DELAY` |
        | `license_plate` | string | Yes | Bus license plate (e.g. `"AB 123 CD"`) |
        | `uuid_terminal` | UUID | Conditional | Target terminal. Required for `super_admin` and for `admin` with more than one terminal |
        | `start_date` | string | Yes | Trip date (`YYYY-MM-DD`), forwarded to the terminals backend |
        | `payload.time_delay` | integer | Yes | Delay in minutes (> 0) |
        | `payload.time_life` | integer | Yes | Notification lifetime in minutes (> 0) |

        **Internal behavior:**

        1. Validates all the request fields.
        2. Resolves the terminal according to the role (same as NOTIFY): if the admin has a single terminal they can omit `uuid_terminal`; if they have several, it is mandatory and must be theirs.
        3. Checks that the terminal has an `external_terminal_id` configured; otherwise returns `409`.
        4. Asks the terminals backend whether a trip exists for that `license_plate`, `start_date` and terminal; if it does not exist returns `409`.
        5. Normalizes the license plate (uppercase, no spaces) to build the `group_key`: `PLATE:terminal_uuid`.
        6. Persists the notification and sends it via SignalR (`NotifyDelayBus`) to the `frontend/PLATE:terminal_uuid` group. The payload sent is `{ id, license_plate, time_delay, time_life }`.

        **Successful response `201 Created`:**

        ```json
        {
          "message": "bus delay notification sent"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Invalid type, missing plate/date, invalid `time_delay`/`time_life`, missing or invalid `uuid_terminal`, admin without terminal |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The terminal does not belong to the admin |
        | `404 Not Found` | Terminal not found |
        | `409 Conflict` | Terminal without a configured `external_terminal_id`, or the trip is not registered in the terminals backend |
        | `502 Bad Gateway` | Error querying the terminals backend or sending the notification |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_admin_notify_bus_delay"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyBusDelayRequest"
            example:
              type: "BUS_DELAY"
              license_plate: "AB 123 CD"
              uuid_terminal: "a0000000-0000-0000-0000-000000000001"
              start_date: "2026-04-27"
              payload:
                time_delay: 15
                time_life: 12
      responses:
        "201":
          description: "Notification sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "bus delay notification sent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/admin/license-plate/read:
    post:
      tags:
        - "Notifications (admin)"
      summary: "Read license plate from a photo (OCR)"
      description: |-
        **Roles:** `admin, super_admin`

        Reads a bus license plate from a photo, using the OCR microservice. The panel uses it to autocomplete the license plate (for example, before `NOTIFY BUS ARRIVAL (MANUAL)` or `NOTIFY BUS DELAY`).

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Body (`multipart/form-data`):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `image` | file | Yes | Photo of the bus / license plate (maximum **10 MB**) |

        In Postman, select the file in the body's `image` field.

        **Internal behavior:**
        1. Reads the file from the `image` field; if it is missing returns `400`, if it is larger than 10 MB returns `413`.
        2. Forwards the image to `POST {OCR_URL}/read-license-plate` (multipart, header `X-API-Key: OCR_API_KEY`).
        3. Interprets the OCR response: `400` → invalid image, `422` → the license plate could not be read.
        4. Normalizes the license plate (uppercase, no spaces). If it ends up empty returns `422`.

        **Successful response `200 OK`:**
        ```json
        {
          "license_plate": "AF226GU"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | The `image` field is missing, or the image could not be read |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user does not have role `admin` or `super_admin` |
        | `413 Request Entity Too Large` | The image exceeds 10 MB |
        | `422 Unprocessable Entity` | No license plate could be read in the image |
        | `502 Bad Gateway` | The OCR microservice does not respond or returns an error |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_admin_license_plate_read"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
                - "image"
              properties:
                image:
                  type: "string"
                  format: "binary"
                  description: "Photo (max. 10 MB)"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicensePlateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /notify_passengers:
    post:
      tags:
        - "Cameras"
      summary: "Notify bus arrival (BUS_ARRIVAL)"
      description: |-
        **Roles:** `camera (X-API-Key), admin, super_admin`

        ### NOTIFY BUS ARRIVAL (MANUAL) (ADMIN - SUPER ADMIN)

        Same endpoint as `NOTIFY BUS ARRIVAL` in the CAMERA folder, but invoked by an admin with their JWT. It is used to announce a bus arrival manually when the camera fails.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`). If the request carries `X-API-Key`, the API key is validated instead.

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `license_plate` | string | Yes | Bus license plate (normalized: uppercase, no spaces) |
        | `code` | string | Yes | Numeric code of the platform/bay where the bus arrives |
        | `time_life` | integer | Yes | Notification lifetime in minutes (> 0) |

        **Differences from the camera:**
        - **`admin`:** can only notify on bays of terminals assigned to them; otherwise returns `403`.
        - **`super_admin`:** can notify on any bay.

        The rest of the behavior (persistence, SignalR, email to waiting passengers) is the one described in `NOTIFY BUS ARRIVAL`.

        **Successful response `200 OK`:**
        ```json
        {
          "message": "passengers notified successfully"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Empty `license_plate`, empty or non-numeric `code`, invalid `time_life` |
        | `401 Unauthorized` | Neither `Authorization` nor `X-API-Key`, or invalid token |
        | `403 Forbidden` | Role other than `admin`/`super_admin`, or the bay belongs to a terminal the admin does not manage |
        | `404 Not Found` | Platform with that code not found |
        | `502 Bad Gateway` | Error persisting or sending the notification via SignalR |
        | `500 Internal Server Error` | Platform without an associated terminal or internal error |

        ### NOTIFY BUS ARRIVAL (CAMERA)

        Notifies passengers that a bus is arriving at a bay (realtime + email). It is invoked by the camera system when it recognizes the license plate of a bus entering the terminal.

        **Authentication:** `X-API-Key: {{CAMERA_API_KEY}}` (camera system API key). It also accepts `Authorization: Bearer <JWT>` from an `admin`/`super_admin` for the manual notice (see `NOTIFY BUS ARRIVAL (MANUAL)` in ADMIN - SUPER ADMIN). If both headers arrive, the API key is used.

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `license_plate` | string | Yes | Bus license plate recognized by the camera (e.g. `"AB123CD"`) |
        | `code` | string | Yes | Numeric code of the platform/bay where the bus arrives |
        | `time_life` | integer | Yes | Notification lifetime in minutes (> 0) |

        **Example:**

        ```json
        {
          "license_plate": "AB123CD",
          "code": "13",
          "time_life": 12
        }
        ```

        **Internal behavior:**

        1. Validates that `license_plate`, `code` (numeric) and `time_life` are present and valid.
        2. Looks up the platform by `code`; if it does not exist returns `404`.
        3. Checks that the platform has an associated terminal; otherwise returns `500`.
        4. If an `admin` (JWT) invokes it, checks that the bay's terminal is theirs (`403`).
        5. Builds the `BUS_ARRIVAL` notification with payload `{ id, bay, coordinates, time_life }`.
        6. Builds the `group_key` as `PLATE:terminal_uuid` (plate in uppercase and without spaces) and persists it.
        7. Sends the notification via SignalR (`SendToFrontend`) to the `frontend/PLATE:terminal_uuid` group.
        8. In the background, marks the passengers who were waiting for that bus at that terminal as notified (`awaited_trip.notified_at`) and sends them the "Your bus has arrived" email with a Google Maps link (only once, even if the camera detects it again). The wait is not deleted: the passenger keeps seeing their trip until they leave it.

        **Successful response `200 OK`:**

        ```json
        {
          "message": "passengers notified successfully"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body, empty `license_plate`, empty or non-numeric `code`, invalid `time_life` |
        | `401 Unauthorized` | API key / token missing or invalid |
        | `403 Forbidden` | (JWT) role not allowed or bay of a terminal the admin does not manage |
        | `404 Not Found` | Platform with that code not found |
        | `500 Internal Server Error` | Platform without an associated terminal or internal error |
        | `502 Bad Gateway` | Error persisting or sending the notification via SignalR |
      operationId: "post_notify_passengers"
      security:
        - cameraApiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyPassengersRequest"
            example:
              license_plate: "AB123CD"
              code: "13"
              time_life: 12
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "passengers notified successfully"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /notify_camera_error:
    post:
      tags:
        - "Cameras"
      summary: "Notify camera error to admins"
      description: |-
        Notifies a terminal's administrators that a camera has an error. It is invoked by the camera system, not by human users.

        **Authentication:** `X-API-Key: {{CAMERA_API_KEY}}` (camera system API key, `CAMERA_NOTIFICATION_API_KEY`; does not accept JWT).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `type` | string | Yes | Must be `CAMERA` |
        | `code_camera` | string | Yes | Numeric code of the platform/bay where the camera is |
        | `payload.message` | string | Yes | Description of the camera error |
        | `payload.time_life` | integer | Yes | Notification lifetime in minutes (> 0) |

        **Example:**
        ```json
        {
          "type": "CAMERA",
          "code_camera": "20",
          "payload": {
            "message": "License plate read error",
            "time_life": 12
          }
        }
        ```

        **Internal behavior:**
        1. Validates the type (`CAMERA`), that `code_camera` is a valid number and that `message` and `time_life` are present.
        2. Looks up the platform by `code_camera`; if it does not exist returns `404`.
        3. Checks that the platform has an associated terminal; otherwise returns `500`.
        4. Builds the notification with type `CAMERA` (adds `payload.id`) and persists it with `group_key = terminal_uuid`.
        5. Sends the notification via SignalR (`NotifyAdminFromCamera`) **to the admins group** of that terminal (`frontend/admin/{terminal_uuid}`).

        **Successful response `200 OK`:**
        ```json
        {
          "type": "CAMERA",
          "payload": {
            "id": "98fb4a77-0a0f-44f0-8067-59e5b7df42ba",
            "message": "License plate read error",
            "time_life": 12
          }
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body, invalid type, empty or non-numeric `code_camera`, empty message, invalid `time_life` |
        | `401 Unauthorized` | API key missing or invalid |
        | `404 Not Found` | Platform with that code not found |
        | `500 Internal Server Error` | Platform without an associated terminal or internal error |
        | `502 Bad Gateway` | Error persisting or sending the notification via SignalR |
      operationId: "post_notify_camera_error"
      security:
        - cameraApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraErrorRequest"
            example:
              type: "CAMERA"
              code_camera: "20"
              payload:
                message: "License plate read error"
                time_life: 12
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/super/terminals:
    get:
      tags:
        - "Terminals"
      summary: "List terminals"
      description: |-
        **Roles:** `super_admin`

        Returns the registered terminals, paginated and ordered by name.

        **Authentication:** `Authorization: Bearer {{token}}` (role `super_admin`).

        **Query params:**
        | Param | Type | Required | Description |
        |---|---|---|---|
        | `page` | int | No | Page number, starts at 1 (default: `1`) |
        | `limit` | int | No | Items per page (default: `10`, maximum: `100`) |
        | `order` | string | No | `ASC` or `DESC` (default: `DESC`; any other value is treated as `DESC`) |

        **Successful response `200 OK`:**
        ```json
        {
          "terminals": [
            {
              "uuid": "a0000000-0000-0000-0000-000000000001",
              "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
              "postal_code": "2820",
              "name": "TERMINAL GUALEGUAYCHU"
            }
          ],
          "page": 1,
          "next": null,
          "prev": null,
          "elements": 1,
          "total_elements": 1
        }
        ```

        **Pagination:** `next` and `prev` are the number of the next/previous page, or `null` if there is none. `elements` is the number of items returned in this page and `total_elements` the unpaginated total. Invalid `page`/`limit` values are ignored and the defaults are used.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_super_terminals"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTerminalsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - "Terminals"
      summary: "Create terminal"
      description: |-
        **Roles:** `super_admin`

        Creates a new terminal. The `external_terminal_id` must exist in the terminals backend (see `GET EXTERNAL TERMINALS`) and not be in use already.

        **Authentication:** `Authorization: Bearer {{token}}` (role `super_admin`).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `postal_code` | string | Yes | Postal code of the city where the terminal is (must exist in `city`) |
        | `name` | string | Yes | Terminal name. Spaces are trimmed and it is uppercased; only letters, numbers and spaces |
        | `external_terminal_id` | UUID | Yes | ID of the terminal in the terminals backend |

        **Example:**
        ```json
        {
          "postal_code": "2820",
          "name": "Terminal Retiro BS AS",
          "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6"
        }
        ```

        **Internal behavior:**
        1. Normalizes the `name` and validates the fields (in order: `postal_code`, `name`, `external_terminal_id`).
        2. Checks that the `external_terminal_id` is not already associated with another terminal; if it is, returns `409`.
        3. Asks the terminals backend whether the `external_terminal_id` exists; if it does not exist returns `400`.
        4. Checks that the `postal_code` exists in the cities table; otherwise returns `404`.
        5. Creates the terminal with a new UUID.

        **Successful response `201 Created`:**
        ```json
        {
          "uuid": "...",
          "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
          "postal_code": "2820",
          "name": "TERMINAL RETIRO BS AS"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body, missing fields, `name` with invalid characters, or `external_terminal_id` nonexistent in the terminals backend |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `404 Not Found` | City with that `postal_code` not found |
        | `409 Conflict` | The `external_terminal_id` is already in use by another terminal |
        | `502 Bad Gateway` | Error querying the terminals backend |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_super_terminals"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTerminalRequest"
            example:
              postal_code: "2820"
              name: "Terminal Retiro BS AS"
              external_terminal_id: "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6"
      responses:
        "201":
          description: "Terminal created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusTerminal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/super/terminals/count:
