        **Internal behavior:**
        1. Gets all the terminals from the database without filtering by user.
        2. Converts the records to the `BusTerminalResponse` model (`external_terminal_id` is omitted if the terminal does not have one).

        **Successful response `200 OK`:**
        ```json
        [
          {
            "uuid": "a0000000-0000-0000-0000-000000000001",
            "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
            "postal_code": "2820",
            "name": "TERMINAL GUALEGUAYCHU"
