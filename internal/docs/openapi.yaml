  /api/admin/users/by-email:
    get:
      tags:
        - "User management"
      summary: "Find user by email"
      description: |-
        **Roles:** `admin, super_admin`

        Finds a user by email and returns a summary: full name, role and, if they are `admin`, the names of the terminals they manage. Used before promoting/demoting.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`, no terminal restriction).

        **Query params:**
        | Param | Type | Required | Description |
        |---|---|---|---|
        | `email` | string | Yes | User email (spaces are trimmed; exact match) |

        **Successful response `200 OK` — `admin` user:**
        ```json
        {
          "name": "Mauro Mendoza",
          "email": "mendozamauro@gmail.com",
          "role": "admin",
          "terminals": ["TERMINAL GUALEGUAYCHU", "TERMINAL RETIRO BS AS"]
        }
        ```

        For other roles (or an admin without terminals) the `terminals` field is omitted.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | `email` parameter missing or empty |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The token's role is not `admin` or `super_admin` |
        | `404 Not Found` | No user exists with that email |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_users_by_email"
      security:
        - bearerAuth: []
      parameters:
        - name: "email"
          in: "query"
