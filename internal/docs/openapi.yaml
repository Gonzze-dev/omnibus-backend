# Backend OpenAPI specification. Served at GET /docs (Swagger UI) and GET /docs/openapi.yaml.
# Each endpoint's description comes from backend.postman_collection.json.
openapi: "3.0.3"
info:
  title: "Omnibus Backend API"
  version: "1.0.0"
  description: |-
    Omnibus backend API: authentication, management of terminals, cities and bays, real-time notifications to passengers and administrators, and integration with cameras and OCR.

    **Authentication**

    - `bearerAuth`: JWT access token obtained from `POST /api/auth/login` (15 minutes). It is renewed with `POST /api/auth/refresh` using the `refresh_token` cookie.
    - `recoveryToken`: password recovery JWT received by email (30 minutes).
    - `cameraApiKey`: `X-API-Key` header of the camera system.

    **Errors:** every error response has the shape `{"message": "..."}`.
servers:
  - url: "/"
    description: "Server this documentation is served from"
  - url: "http://localhost:4989"
    description: "Local"
tags:
  - name: "System"
    description: "Health check"
  - name: "Auth"
    description: "Registration, login, refresh and password recovery"
  - name: "Bus tickets"
    description: "Bus ticket lookups against the terminals backend"
  - name: "User"
    description: "Endpoints for any authenticated user"
  - name: "Cities"
    description: "Cities CRUD (read: admin and super_admin; write: super_admin only)"
  - name: "Platforms"
    description: "Platforms (bays) CRUD"
  - name: "User management"
    description: "Listing and role changes"
  - name: "Statistics"
    description: "Totals for the dashboard"
  - name: "Notifications (admin)"
    description: "Sending, history and deletion of notifications"
  - name: "Cameras"
    description: "Endpoints called by the camera system (X-API-Key)"
  - name: "Terminals"
    description: "Terminals CRUD (super_admin only)"
paths:
  /:
    get:
      tags:
        - "System"
      summary: "Redirects to the health check"
      description: |-
        Redirects to `/health`. It makes opening the backend base URL in the browser show the health check.

        **Authentication:** Not required.

        **Response:** `302 Found` with header `Location: /health` (Postman follows the redirect and shows `OK`).
      operationId: "get_root"
      security: []
      responses:
        "302":
          description: "Redirect to `/health`"
          headers:
            Location:
              schema:
                type: "string"
                example: "/health"
  /health:
    get:
      tags:
        - "System"
      summary: "Health check"
      description: |-
        Checks that the server is up and responding.

        **Authentication:** Not required.

        **Body:** None.

        **Successful response `200 OK`** (plain text, `Content-Type: text/plain`):
        ```
        OK
        ```

        `GET /` redirects here (`302 Found` → `/health`).
      operationId: "get_health"
      security: []
      responses:
        "200":
          description: "Server is up"
          content:
            text/plain:
              schema:
                type: "string"
                example: "OK"
  /api/auth/register:
    post:
      tags:
        - "Auth"
      summary: "Register user"
      description: |-
        Registers a new user with role `user`.

        **Authentication:** Not required.

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `first_name` | string | Yes | First name |
        | `last_name` | string | Yes | Last name |
        | `email` | string | Yes | Unique email |
        | `password` | string | Yes | Password (hashed with bcrypt) |

        **Internal behavior:**

        1. Validates that all fields are present (in order: `email`, `password`, `first_name`, `last_name`).
        2. Checks that the email is not registered; if it already exists returns `409`.
        3. Gets the `user` role from the database.
        4. Hashes the password with bcrypt (default cost).
        5. Creates the user with a new UUID and persists it in the database.

        It does not log in: to get a token you have to call `LOGIN`.

        **Successful response `201 Created`:**

        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "role": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body or missing fields |
        | `409 Conflict` | The email is already registered |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_auth_register"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              first_name: "Juan"
              last_name: "Pérez"
              email: "juan@gmail.com"
              password: "1234"
      responses:
        "201":
          description: "User created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags:
        - "Auth"
      summary: "Log in"
      description: |-
        Authenticates a user and returns a JWT access token. The refresh token is **not** sent in the body: it is set as an `HttpOnly` cookie.

        **Authentication:** Not required.

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `email` | string | Yes | User email |
        | `password` | string | Yes | Plain-text password |

        **Internal behavior:**

        1. Validates that email and password are present.
        2. Looks up the user by email; if it does not exist returns `401`.
        3. Compares the password with the stored bcrypt hash.
        4. Generates a JWT (HS256) **access token** lasting **15 minutes** that includes the user's UUID (`user_id`) and role (`role`).
        5. Generates a **refresh token** (UUID), hashes it with SHA-256 and persists it in the database (upsert: one session per user) with an expiration of **7 days**.
        6. Sets the refresh token as an `HttpOnly` cookie (`refresh_token`, path `/api/auth`, `SameSite=Lax`, 7 days).

        The tests script stores `access_token` in the `token` collection variable.

        **Successful response `200 OK`:**

        ```json
        {
          "access_token": "<JWT>",
          "user": {
            "uuid": "...",
            "first_name": "...",
            "last_name": "...",
            "email": "...",
            "role": "super_admin",
            "created_at": "2026-05-04T15:30:00Z",
            "updated_at": "2026-05-04T15:30:00Z"
          }
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body or missing fields |
        | `401 Unauthorized` | Email not registered or wrong password |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_auth_login"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "juan@gmail.com"
              password: "1234"
      responses:
        "200":
          description: "Login successful. The refresh token is set as an `HttpOnly` cookie."
          headers:
            Set-Cookie:
              description: "`refresh_token=<token>; Path=/api/auth; HttpOnly; SameSite=Lax; Max-Age=604800`"
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/refresh:
    post:
      tags:
        - "Auth"
      summary: "Renew access token"
      description: |-
        Renews the access token using the refresh token stored in a cookie. Requires no body or authorization header.

        **Authentication:** `refresh_token` cookie (set automatically by `/login` or a previous call to this same endpoint).

        **Body:** None.

        **Internal behavior:**
        1. Reads the refresh token from the `refresh_token` cookie. If it does not exist returns `401`.
        2. Hashes the token with SHA-256 and looks it up in the database.
        3. Checks that it has not expired (lifetime: **7 days**). If it expired, deletes the record and returns `401`.
        4. Generates a new JWT **access token** (15 min, with the user's current role) and a new **refresh token** (token rotation).
        5. Updates the record in the database (upsert) and renews the `refresh_token` cookie.

        The tests script stores `access_token` in the `token` collection variable.

        **Successful response `200 OK`:**
        ```json
        {
          "access_token": "<new JWT>"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing cookie, invalid or expired token |
        | `500 Internal Server Error` | Internal error (includes deleted user) |
      operationId: "post_api_auth_refresh"
      security:
        - refreshCookie: []
      responses:
        "200":
          description: "Token renewed (also rotates the `refresh_token` cookie)."
          headers:
            Set-Cookie:
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags:
        - "Auth"
      summary: "Log out"
      description: |-
        Logs the user out by invalidating their refresh token. Requires no body or authorization header.

        **Authentication:** `refresh_token` cookie.

        **Body:** None.

        **Internal behavior:**
        1. Reads the refresh token from the `refresh_token` cookie. If it does not exist returns `401`.
        2. Hashes the token with SHA-256 and looks up the record in the database.
        3. Deletes the user's refresh token from the database (invalidates the session).
        4. Clears the client's `refresh_token` cookie (MaxAge = -1).

        **Successful response `200 OK`:**
        ```json
        {
          "message": "logged out successfully"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing cookie or invalid refresh token |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_auth_logout"
      security:
        - refreshCookie: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "logged out successfully"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/forgot-password:
    post:
      tags:
        - "Auth"
      summary: "Request password recovery"
      description: |-
        Starts the password recovery flow: if the email exists, sends it an email with a link to reset the password.

        **Authentication:** Not required.

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `email` | string | Yes | Account email (spaces are trimmed) |

        **Internal behavior:**
        1. Validates that `email` is not empty; if it is, returns `400`.
        2. Looks up the user by email. **If it does not exist it still responds `200`** (it does not reveal which emails are registered).
        3. Signs a recovery JWT (HS256, `PASSWORD_RESET_JWT_SECRET`) with the `user_id` and an expiration of **30 minutes**.
        4. Builds the link `{FRONT_END_BASE_LINK}/reset-password?token=<TOKEN>` and sends the email with the `ResetPasswordTemplate.html` template.
        5. If configuration is missing (`PASSWORD_RESET_JWT_SECRET`, `FRONT_END_BASE_LINK` or SMTP) or sending fails, the error is only logged: the response is still `200`.

        To test the rest of the flow, copy the token from the link into the `TOKEN_RECOVER_PASS` variable.

        **Successful response `200 OK`:**
        ```json
        {
          "message": "correo enviado"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body or empty `email` |
        | `500 Internal Server Error` | Error querying the database |
      operationId: "post_api_auth_forgot_password"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            example:
              email: "juan@gmail.com"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "correo enviado"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/validate-recovery-token:
    post:
      tags:
        - "Auth"
      summary: "Validate recovery token"
      description: |-
        Checks whether a password recovery token is valid and has not expired. This token is obtained through `FORGOT PASSWORD`, which sends an email with the link `{FRONT_END_BASE_LINK}/reset-password?token=<TOKEN>`.

        **Authentication:** `Authorization: Bearer <TOKEN_RECOVER_PASS>` — special JWT signed with `PASSWORD_RESET_JWT_SECRET` (it is not the login access token).

        **Body:** None.

        **Internal behavior:**
        1. Extracts the token from the `Authorization` header (Bearer scheme).
        2. Parses the JWT using `PASSWORD_RESET_JWT_SECRET` with the HS256 algorithm.
        3. Checks that the signature is valid, that `user_id` is not null and that the token has not expired (lifetime: **30 minutes** from issuance).
        4. If everything is valid, returns the expiration date (UTC).

        **Successful response `200 OK`:**
        ```json
        {
          "valid": true,
          "expires_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | `Authorization` header missing or not in `Bearer <token>` format, or token invalid, with a wrong signature or expired (also if `PASSWORD_RESET_JWT_SECRET` is not configured) |
      operationId: "post_api_auth_validate_recovery_token"
      security:
        - recoveryToken: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateRecoveryTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/reset-password:
    post:
      tags:
        - "Auth"
      summary: "Reset password"
      description: |-
        Changes the user's password using the recovery token received by email.

        **Authentication:** `Authorization: Bearer <TOKEN_RECOVER_PASS>` — recovery JWT (signed with `PASSWORD_RESET_JWT_SECRET`).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `password` | string | Yes | New password (cannot be empty or only spaces) |

        **Internal behavior:**
        1. Extracts the token from the `Authorization` header; if it is missing or is not `Bearer <token>` returns `401`.
        2. Validates that `password` is not empty (`400`).
        3. Validates the token (signature, `user_id` and 30-minute expiration); if it is invalid returns `401`.
        4. Looks up the user; if it no longer exists returns `401`.
        5. Hashes the new password with bcrypt and saves it.
        6. Deletes the user's refresh token: **closes all their open sessions**.

        The token remains valid until it expires (it is not single-use).

        **Successful response `200 OK`:**
        ```json
        {
          "message": "password updated"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body or empty `password` |
        | `401 Unauthorized` | Missing/malformed header, invalid or expired token, or nonexistent user |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_auth_reset_password"
      security:
        - recoveryToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            example:
              password: "nuevaPass123"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "password updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /bus_tickets/{ticket_string}:
    get:
      tags:
        - "Bus tickets"
      summary: "Look up bus ticket (proxy to the terminals backend)"
      description: |-
        Looks up a bus ticket in the terminals backend and returns its information. It is a proxy: it forwards `GET /bus_tickets/{ticket_string}` to the external service (`TERMINAL_API_URL`) and returns the same status code.

        **Authentication:** Not required.

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `ticket_string` | string | Bus ticket code (e.g. `SUV-226780488-0`). In Postman use the `{{ticket}}` collection variable |

        **Internal behavior:**
        1. Calls the terminals backend with the bus ticket code.
        2. If the response is `200`, normalizes the data: `bus_terminal_name`, `ticket`, `name`, `enterprise` and `trip_city[].city_name` in uppercase; `bus_license_plate` in uppercase and without spaces.
        3. Returns the external service's body and status as-is (if the body is not JSON it wraps it in `{ "data": "..." }`; if it is empty it responds with no body).

        **Successful response `200 OK`:**
        ```json
        {
          "postal_code": "3260",
          "bus_terminal_name": "TERMINAL CONCEPCIÓN DEL URUGUAY",
          "terminal_uuid": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
          "ticket": "SUV-226780488-0",
          "dni": "40111222",
          "name": "GONZALO ERRANDONEA",
          "bus_license_plate": "AF226GU",
          "enterprise": "NUEVO EXPRESO",
          "start_date": "2026-09-27T20:00:00",
          "end_date": "2026-09-28T01:30:00",
          "trip_city": [
            { "city_name": "GUALEGUAYCHÚ", "start_date": "2026-09-27T21:00:00", "end_date": "2026-09-27T21:15:00", "order": 2 }
          ],
          "uuid": "3dfad7a5-aafb-4c18-8e03-847687814886"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `404 Not Found` | (from the external service) The bus ticket does not exist |
        | `500 Internal Server Error` | The terminals backend could not be reached |
      operationId: "get_bus_tickets_ticket_string"
      security: []
      parameters:
        - name: "ticket_string"
          in: "path"
          required: true
          description: "Bus ticket code"
          schema:
            type: "string"
          example: "SUV-226780488-0"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusTicket"
        "404":
          description: "The bus ticket does not exist in the terminals backend"
        default:
          description: "Status and body returned as-is by the terminals backend"
          content:
            application/json:
              schema:
                type: "object"
  /api/users/me:
    get:
      tags:
        - "User"
      summary: "Get profile"
      description: |-
        Returns the profile information of the authenticated user. If the user is `admin`, it also includes the list of terminals they manage.

        **Authentication:** `Authorization: Bearer {{token}}` (any role).

        **Body:** None.

        **Internal behavior:**
        1. Gets the user's UUID from the JWT.
        2. Looks up the user in the database; if it does not exist returns `404`.
        3. If the role is `admin`, queries the terminals associated with the user and includes them in `terminals` (the field is omitted if there are none or if the role is different).

        **Successful response `200 OK` — role `user` or `super_admin`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "role": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Successful response `200 OK` — role `admin`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "role": "admin",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z",
          "terminals": [
            { "uuid": "a0000000-0000-0000-0000-000000000001", "name": "TERMINAL RETIRO BS AS" }
          ]
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `404 Not Found` | User not found |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_users_me"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "User"
      summary: "Update profile"
      description: |-
        Updates the profile data of the authenticated user. All fields are optional, but at least one must be sent.

        **Authentication:** `Authorization: Bearer {{token}}` (any role).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `first_name` | string | No | New first name |
        | `last_name` | string | No | New last name |
        | `email` | string | No | New email (must be unique) |
        | `password` | string | No | New password (hashed with bcrypt) |

        **Example:**
        ```json
        {
          "first_name": "Juan",
          "last_name": "Pérez",
          "email": "new@gmail.com",
          "password": "nuevaPass123"
        }
        ```

        **Internal behavior:**
        1. Validates that at least one field is present and that none of the ones sent is `""`; otherwise returns `400`.
        2. Looks up the user in the database by the token's UUID; if it does not exist returns `404`.
        3. Applies only the fields present (partial patch).
        4. If `email` changes, checks that it is not in use by another user; if it is, returns `409`.
        5. If `password` changes, hashes it with bcrypt before saving (open sessions are not closed).

        **Successful response `200 OK`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "role": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Empty body, or some field sent is empty |
        | `401 Unauthorized` | Missing or invalid token |
        | `404 Not Found` | User not found |
        | `409 Conflict` | The email is already in use by another user |
        | `500 Internal Server Error` | Internal error |
      operationId: "put_api_users_me"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              first_name: "Juan"
              last_name: "Pérez"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - "User"
      summary: "Delete account"
      description: |-
        Permanently deletes the authenticated user's account.

        **Authentication:** `Authorization: Bearer {{token}}`.

        **Body:** None.

        **Internal behavior:**
        1. Gets the user's UUID from the JWT.
        2. Checks that the user exists in the database; if it does not exist returns `404`.
        3. Deletes the user's refresh token (closes the active session).
        4. Deletes the user record from the database.

        The access token already issued remains valid until it expires (15 min), but the endpoints that look up the user will return `404`.

        **Successful response `200 OK`:**
        ```json
        {
          "message": "account deleted successfully"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `404 Not Found` | The user does not exist |
        | `500 Internal Server Error` | Internal error |
      operationId: "delete_api_users_me"
      security:
