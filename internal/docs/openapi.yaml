        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "Ciudades"
      summary: "Actualizar ciudad"
      description: |-
        **Roles:** `super_admin`

        Actualiza los datos de una ciudad existente. Ambos campos son opcionales.

        **Autenticación:** `Authorization: Bearer {{token}}` (**solo `super_admin`**).

        **Path param:**
        | Param | Tipo | Descripción |
        |---|---|---|
        | `postal_code` | string | Código postal actual de la ciudad a modificar |

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `postal_code` | string | No | Nuevo código postal (debe ser único) |
        | `name` | string | No | Nuevo nombre de la ciudad (se guarda en mayúsculas) |

        **Ejemplo:**

        ```json
        {
          "postal_code": "2821",
          "name": "Buenos Aires - La Plata"
        }
        ```

        **Comportamiento interno:**

        1. Busca la ciudad por el `postal_code` del path; si no existe devuelve `404`.
        2. Aplica los campos presentes en el body (patch parcial). El `name` se pasa a mayúsculas.
        3. Si se cambia el `postal_code`, verifica que el nuevo no esté en uso; si ya existe devuelve `409`. Luego actualiza nombre y código en dos pasos.
        4. Si solo cambia el `name`, actualiza directamente. Un body vacío no modifica nada y devuelve la ciudad.

        **Respuesta exitosa `200 OK`:**

        ```json
        {
          "postal_code": "2821",
          "name": "BUENOS AIRES - LA PLATA"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `404 Not Found` | No existe una ciudad con ese código postal |
        | `409 Conflict` | El nuevo código postal ya está en uso |
        | `500 Internal Server Error` | Error interno |
      operationId: "put_api_admin_cities_postal_code"
      security:
        - bearerAuth: []
      parameters:
        - name: "postal_code"
          in: "path"
          required: true
          description: "Código postal actual"
          schema:
            type: "string"
          example: "2820"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCityRequest"
            example:
              postal_code: "2821"
              name: "Buenos Aires - La Plata"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - "Ciudades"
      summary: "Eliminar ciudad"
      description: |-
        **Roles:** `super_admin`

        Elimina una ciudad del sistema identificada por su código postal.

        **Autenticación:** `Authorization: Bearer {{token}}` (**solo `super_admin`**).

        **Path param:**
        | Param | Tipo | Descripción |
        |---|---|---|
        | `postal_code` | string | Código postal de la ciudad a eliminar |

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Verifica que exista la ciudad con ese `postal_code`; si no existe devuelve `404`.
        2. Elimina el registro de la base de datos.

        **Respuesta exitosa `204 No Content`:** Sin cuerpo.

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `404 Not Found` | No existe una ciudad con ese código postal |
        | `500 Internal Server Error` | Error interno (ej: la ciudad tiene terminales asociadas) |
      operationId: "delete_api_admin_cities_postal_code"
      security:
        - bearerAuth: []
      parameters:
        - name: "postal_code"
          in: "path"
          required: true
          description: "Código postal"
          schema:
            type: "string"
          example: "2820"
      responses:
        "204":
          description: "Sin contenido"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/platforms:
    get:
      tags:
        - "Plataformas"
      summary: "Listar plataformas agrupadas por terminal"
      description: |-
        **Roles:** `admin, super_admin`

        Devuelve las plataformas (andenes) agrupadas por terminal, paginadas **por terminal**. Las terminales se ordenan por nombre y los andenes de cada una por `anden`. La visibilidad depende del rol.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Query params:**
        | Param | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `bus_terminal_id` | UUID | No | Filtra por una terminal específica (el resultado es una sola terminal) |
        | `page` | int | No | Número de página, empieza en 1 (default: `1`) |
        | `limit` | int | No | Elementos por página (default: `10`, máximo: `100`) |
        | `order` | string | No | `ASC` o `DESC` (default: `DESC`; cualquier otro valor se toma como `DESC`) |

        **Comportamiento interno según rol:**
        - **`super_admin`:** Todas las terminales (o la indicada en `bus_terminal_id`; si no existe devuelve `404`).
        - **`admin`:** Solo las terminales que administra. Si se pasa `bus_terminal_id`, verifica que esa terminal le pertenezca; si no, devuelve `403`.

        Las terminales sin andenes también aparecen (con `platforms: []`).

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "platforms": [
            {
              "uuid": "a0000000-0000-0000-0000-000000000001",
              "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
              "postal_code": "2820",
              "name": "TERMINAL GUALEGUAYCHU",
              "platforms": [
                { "code": 1, "anden": "A1", "coordinates": { "lat": -34.6037, "lng": -58.3816 } }
              ]
            }
          ],
          "page": 1,
          "next": null,
          "prev": null,
          "elements": 1,
          "total_elements": 1
        }
        ```

        **Paginación:** `next` y `prev` son el número de la página siguiente/anterior, o `null` si no existe. `elements` es la cantidad de ítems devueltos en esta página y `total_elements` el total sin paginar. Valores inválidos de `page`/`limit` se ignoran y se usan los defaults. `elements` y `total_elements` cuentan terminales, no andenes.

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | `bus_terminal_id` con formato inválido |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El admin no es dueño de esa terminal |
        | `404 Not Found` | Terminal no encontrada |
        | `500 Internal Server Error` | Error interno |
      operationId: "get_api_admin_platforms"
      security:
        - bearerAuth: []
      parameters:
        - name: "bus_terminal_id"
          in: "query"
          required: false
          description: "Filtra por una terminal específica."
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPlatformsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - "Plataformas"
      summary: "Crear plataforma"
      description: |-
        **Roles:** `admin, super_admin`

        Crea una nueva plataforma (andén) asociada a una terminal.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `anden` | string | Sí | Identificador del andén (ej: `"A20"`). Se recortan espacios y se pasa a mayúsculas; solo letras, números y `-` |
        | `coordinates` | object | No | Coordenadas geográficas `{ "lat": float, "lng": float }` (se guarda como JSON tal cual) |
        | `bus_terminal_id` | UUID | Sí | UUID de la terminal a la que pertenece el andén |

        **Ejemplo:**
        ```json
        {
          "anden": "A20",
          "coordinates": { "lat": -34.6037, "lng": -58.3816 },
          "bus_terminal_id": "a0000000-0000-0000-0000-000000000001"
        }
        ```

        **Comportamiento interno:**
        1. Normaliza y valida `anden`; si está vacío o tiene caracteres inválidos devuelve `400`.
        2. Según el rol:
           - **`super_admin`:** verifica que la terminal exista (`404`).
           - **`admin`:** verifica que la terminal le pertenezca (`403`, también si no existe).
        3. Crea la plataforma; el `code` lo asigna la base de datos.

        **Respuesta exitosa `201 Created`:**
        ```json
        {
          "code": 21,
          "anden": "A20",
          "coordinates": { "lat": -34.6037, "lng": -58.3816 },
          "bus_terminal_id": "a0000000-0000-0000-0000-000000000001"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado, `anden` vacío o con caracteres inválidos |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El admin no es dueño de esa terminal |
        | `404 Not Found` | Terminal no encontrada (`super_admin`) |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_admin_platforms"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlatformRequest"
            example:
              anden: "A20"
              coordinates:
                lat: -34.6037
                lng: -58.3816
              bus_terminal_id: "a0000000-0000-0000-0000-000000000001"
      responses:
        "201":
          description: "Plataforma creada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
