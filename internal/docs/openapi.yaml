        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/users/promote:
    post:
      tags:
        - "Gestión de usuarios"
      summary: "Promover a admin de una terminal"
      description: |-
        **Roles:** `admin, super_admin`

        Promueve a un usuario al rol de `admin` y lo asocia a una terminal. Si el usuario ya era admin de otras terminales, se le agrega la nueva sin pisar las existentes.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `email` | string | Sí | Email del usuario a promover |
        | `bus_terminal_id` | UUID | Sí | Terminal a la que se lo asocia como admin |

        **Ejemplo:**
        ```json
        {
          "email": "usuario@gmail.com",
          "bus_terminal_id": "a0000000-0000-0000-0000-000000000001"
        }
        ```

        **Comportamiento interno según rol:**
        - **`super_admin`:** Verifica que la terminal exista (`404`). Puede promover a cualquier usuario.
        - **`admin`:** Verifica que la terminal sea una de las suyas; si no, devuelve `403` (también si `bus_terminal_id` falta o no existe).

        **Lógica común:**
        1. Valida que `email` esté presente.
        2. Busca al usuario por email; si no existe devuelve `404`.
        3. Si el usuario ya es `super_admin`, devuelve `409`.
        4. Cambia el rol del usuario a `admin`.
        5. Si el usuario aún no está asociado a esa terminal, crea la relación `user_terminal`.

        El usuario promovido recibe el nuevo rol en su JWT al hacer `REFRESH` o `LOGIN`.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "rol": "admin",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado o `email` faltante |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El admin no es dueño de esa terminal |
        | `404 Not Found` | Usuario o terminal no encontrados |
        | `409 Conflict` | El usuario ya es `super_admin` |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_admin_users_promote"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTerminalRequest"
            example:
              email: "usuario@gmail.com"
              bus_terminal_id: "a0000000-0000-0000-0000-000000000001"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/users/demote:
    post:
      tags:
        - "Gestión de usuarios"
      summary: "Quitar admin de una terminal"
      description: |-
        **Roles:** `admin, super_admin`

        Quita la asociación de un admin a una terminal. Si el admin ya no tiene ninguna terminal asignada, su rol vuelve a `user` automáticamente.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `email` | string | Sí | Email del admin a degradar |
        | `bus_terminal_id` | UUID | Sí | Terminal de la que se le quita la responsabilidad |

        **Ejemplo:**
        ```json
        {
          "email": "admin@gmail.com",
          "bus_terminal_id": "a0000000-0000-0000-0000-000000000002"
        }
        ```

        **Comportamiento interno según rol:**
        - **`super_admin`:** Puede degradar a cualquier admin de cualquier terminal.
        - **`admin`:** Solo puede degradar admins de sus propias terminales (`403` si no es suya). Además, **no puede degradarse a sí mismo** (`400`).

        **Lógica común:**
        1. Valida que `email` esté presente.
        2. Busca al usuario por email; si no existe devuelve `404`.
        3. Verifica que el usuario tenga rol `admin`; si no devuelve `400`.
        4. Elimina la relación `user_terminal` para esa terminal (si no existía, no hace nada).
        5. Si el usuario ya no tiene ninguna terminal asociada, cambia su rol a `user`.

        **Respuesta exitosa `200 OK`** (con el rol resultante: `admin` si le quedan terminales, `user` si no):
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "rol": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado, `email` faltante, el usuario no es admin, o el admin intenta degradarse a sí mismo |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El admin no es dueño de esa terminal |
        | `404 Not Found` | Usuario no encontrado |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_admin_users_demote"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTerminalRequest"
            example:
              email: "admin@gmail.com"
              bus_terminal_id: "a0000000-0000-0000-0000-000000000002"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
