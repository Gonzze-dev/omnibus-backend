      type: "object"
      properties:
        access_token:
          type: "string"
          description: "New HS256 JWT, 15 minutes"
      required:
        - "access_token"
    EmailRequest:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
      required:
        - "email"
    ValidateRecoveryTokenResponse:
      type: "object"
      properties:
