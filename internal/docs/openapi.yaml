      summary: "Eliminar notificación"
      description: |-
        **Roles:** `admin, super_admin`

        Elimina una notificación del sistema y la retira en tiempo real del frontend vía SignalR.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Query params:**
        | Param | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `notification_id` | UUID | Sí | ID de la notificación a eliminar |

        **Body:** Ninguno.

        **Comportamiento interno según rol:**
        - **`super_admin`:** Puede eliminar cualquier notificación. La busca, envía el evento `DeleteNotification(id, group_name)` por SignalR y la borra de la BD.
        - **`admin`:** Solo puede eliminar notificaciones de sus terminales (incluidas `CAMERA` y las de patente+terminal). No puede eliminar notificaciones `GLOBAL` (`group_key` nulo). Verifica que el `group_key` contenga el UUID de alguna de sus terminales; si no, devuelve `403`.

        Si falla el envío por SignalR, la notificación **no** se borra.

        **Respuesta exitosa `204 No Content`:** Sin cuerpo.

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | `notification_id` ausente o con formato UUID inválido, admin sin terminal asignada |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | Rol no permitido, notificación `GLOBAL` intentada borrar por `admin`, o notificación de otra terminal |
        | `404 Not Found` | Notificación no encontrada |
        | `500 Internal Server Error` | Error interno o error al enviar el evento por SignalR |
