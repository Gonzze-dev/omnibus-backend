        `LOCAL`/`GLOBAL` are sent with `NOTIFY`, `BUS_DELAY` with `NOTIFY BUS DELAY` and `BUS_ARRIVAL` with `NOTIFY BUS ARRIVAL (MANUAL)`.

        **Successful response `200 OK` — `admin`:**
        ```json
        {
          "types": ["LOCAL", "BUS_DELAY", "BUS_ARRIVAL"]
        }
        ```

        **Successful response `200 OK` — `super_admin`:**
        ```json
        {
          "types": ["LOCAL", "GLOBAL", "BUS_DELAY", "BUS_ARRIVAL"]
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user does not have role `admin` or `super_admin` |
      operationId: "get_api_admin_notification_types"
      security:
