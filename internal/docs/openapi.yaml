  /api/super/terminals/{uuid}:
    get:
      tags:
        - "Terminals"
      summary: "Get terminal"
      description: |-
        **Roles:** `super_admin`

        Returns the data of a specific terminal by its UUID.

        **Authentication:** `Authorization: Bearer {{token}}` (role `super_admin`).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `uuid` | UUID | Terminal UUID |

        **Body:** None.

        **Internal behavior:**
        1. Parses the path UUID; if it is invalid returns `400`.
        2. Looks up the terminal in the database; if it does not exist returns `404`.

        **Successful response `200 OK`:**
        ```json
        {
          "uuid": "a0000000-0000-0000-0000-000000000001",
          "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
          "postal_code": "2820",
          "name": "TERMINAL GUALEGUAYCHU"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | UUID with an invalid format |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `404 Not Found` | Terminal not found |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_super_terminals_uuid"
      security:
        - bearerAuth: []
      parameters:
        - name: "uuid"
          in: "path"
          required: true
          description: "Terminal UUID"
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusTerminal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "Terminals"
      summary: "Update terminal"
      description: |-
        **Roles:** `super_admin`

        Updates the data of an existing terminal. All fields are optional (an empty body changes nothing).

        **Authentication:** `Authorization: Bearer {{token}}` (role `super_admin`).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `uuid` | UUID | UUID of the terminal to update |

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `postal_code` | string | No | New postal code (must exist in `city`) |
        | `name` | string | No | New name (uppercase; only letters, numbers and spaces) |
        | `external_terminal_id` | UUID | No | New external ID (must exist in the terminals backend and not be in use) |

        **Example:**
        ```json
        {
          "postal_code": "2820",
          "name": "Terminal Gualeguaychu",
          "external_terminal_id": "c11ea199-91e2-43d4-a72e-1ed619258ac5"
        }
        ```

        **Internal behavior:**
        1. Normalizes and validates `name` if present; `external_terminal_id` cannot be the nil UUID.
        2. Looks up the terminal by UUID; if it does not exist returns `404`.
        3. If `postal_code` changes, checks that the city exists; otherwise returns `404`.
        4. If `external_terminal_id` changes and differs from the current one: checks that it is not in use by another terminal (`409`) and that it exists in the terminals backend (`400` / `502`).
        5. Applies the changes and persists them.

        **Successful response `200 OK`:**
        ```json
        {
          "uuid": "a0000000-0000-0000-0000-000000000001",
          "external_terminal_id": "c11ea199-91e2-43d4-a72e-1ed619258ac5",
          "postal_code": "2820",
          "name": "TERMINAL GUALEGUAYCHU"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Invalid UUID, malformed body, `name` empty or with invalid characters, or `external_terminal_id` nonexistent in the terminals backend |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `404 Not Found` | Terminal or city not found |
        | `409 Conflict` | The `external_terminal_id` is already in use by another terminal |
        | `502 Bad Gateway` | Error querying the terminals backend |
        | `500 Internal Server Error` | Internal error |
      operationId: "put_api_super_terminals_uuid"
      security:
        - bearerAuth: []
      parameters:
        - name: "uuid"
          in: "path"
          required: true
          description: "Terminal UUID"
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTerminalRequest"
            example:
              postal_code: "2820"
              name: "Terminal Gualeguaychu"
              external_terminal_id: "c11ea199-91e2-43d4-a72e-1ed619258ac5"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusTerminal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      tags:
        - "Terminals"
      summary: "Delete terminal"
      description: |-
        **Roles:** `super_admin`

        Deletes a terminal from the system by its UUID.

        **Authentication:** `Authorization: Bearer {{token}}` (role `super_admin`).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `uuid` | UUID | UUID of the terminal to delete |

        **Body:** None.

        **Internal behavior:**
        1. Parses the path UUID; if it is invalid returns `400`.
        2. Checks that the terminal exists; otherwise returns `404`.
        3. Deletes the record from the database.

        **Successful response `204 No Content`:** No body.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | UUID with an invalid format |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `404 Not Found` | Terminal not found |
        | `500 Internal Server Error` | Internal error |
      operationId: "delete_api_super_terminals_uuid"
      security:
        - bearerAuth: []
      parameters:
        - name: "uuid"
          in: "path"
          required: true
          description: "Terminal UUID"
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
      responses:
        "204":
          description: "No content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/super/get-external-terminals:
    get:
      tags:
        - "Terminals"
      summary: "List terminals of the external system"
      description: |-
        **Roles:** `super_admin`

        Lists the terminals of the terminals backend (external bus ticket system). Used to choose the `external_terminal_id` when creating or editing a terminal.

        **Authentication:** `Authorization: Bearer {{token}}` (role `super_admin`).

        **Body:** None.

        **Internal behavior:**
        1. Calls `GET {TERMINAL_API_URL}/terminal/`.
        2. Returns each terminal with its `uuid` and the normalized name (without leading/trailing spaces and in uppercase).

        It does not indicate whether the external terminal is already associated with a local terminal.

        **Successful response `200 OK`:**
        ```json
        [
          { "uuid": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6", "name": "TERMINAL CONCEPCIÓN DEL URUGUAY" },
          { "uuid": "c11ea199-91e2-43d4-a72e-1ed619258ac5", "name": "TERMINAL GUALEGUAYCHÚ" }
        ]
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `502 Bad Gateway` | The terminals backend does not respond or returns an error |
      operationId: "get_api_super_get_external_terminals"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ExternalTerminal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/super/users/promote-super:
    post:
      tags:
        - "User management"
      summary: "Promote to super_admin"
      description: |-
        **Roles:** `super_admin`

        Promotes a user to the `super_admin` role. If the user was `admin`, all their terminal associations are deleted.

        **Authentication:** `Authorization: Bearer {{token}}` (role `super_admin`).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `email` | string | Yes | Email of the user to promote |

        **Example:**
        ```json
        {
          "email": "user@gmail.com"
        }
        ```

        **Internal behavior:**
        1. Validates that `email` is present.
        2. Looks up the user by email; if it does not exist returns `404`.
        3. If the user is already `super_admin`, returns `409`.
        4. Changes the user's role to `super_admin`.
        5. Deletes all the user's `user_terminal` relationships (a `super_admin` is not tied to specific terminals).

        **Successful response `200 OK`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "role": "super_admin",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body, missing `email` |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `404 Not Found` | User not found |
        | `409 Conflict` | The user is already `super_admin` |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_super_users_promote_super"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            example:
              email: "user@gmail.com"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/super/users/demote-super:
    post:
      tags:
        - "User management"
      summary: "Remove super_admin role"
      description: |-
        **Roles:** `super_admin`

        Removes the `super_admin` role from a user, demoting them directly to `user`.

        **Authentication:** `Authorization: Bearer {{token}}` (role `super_admin`).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `email` | string | Yes | Email of the super admin to demote |

        **Example:**
        ```json
        {
          "email": "superadmin@gmail.com"
        }
        ```

        **Internal behavior:**
        1. Validates that `email` is present.
        2. Looks up the user by email; if it does not exist returns `404`.
        3. Checks that the user has role `super_admin`; otherwise returns `400`.
        4. Changes the user's role to `user` directly (without going through `admin`). A `super_admin` can demote themselves.

        **Successful response `200 OK`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "role": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body, missing `email` or the user is not `super_admin` |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `404 Not Found` | User not found |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_super_users_demote_super"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            example:
              email: "superadmin@gmail.com"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Access token returned by `/api/auth/login` or `/api/auth/refresh`."
    recoveryToken:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Password recovery token (signed with `PASSWORD_RESET_JWT_SECRET`)."
    cameraApiKey:
      type: "apiKey"
      in: "header"
      name: "X-API-Key"
      description: "Camera system API key (`CAMERA_NOTIFICATION_API_KEY`)."
    refreshCookie:
      type: "apiKey"
      in: "cookie"
      name: "refresh_token"
      description: "`HttpOnly` cookie set by login/refresh (path `/api/auth`)."
  parameters:
    Page:
      name: "page"
      in: "query"
      required: false
      description: "Page number, starts at 1."
      schema:
        type: "integer"
        minimum: 1
        default: 1
    Limit:
      name: "limit"
      in: "query"
      required: false
      description: "Items per page."
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 10
    Order:
      name: "order"
      in: "query"
      required: false
      description: "Order (any other value is treated as `DESC`)."
      schema:
        type: "string"
        enum:
          - "ASC"
          - "DESC"
        default: "DESC"
  responses:
    BadRequest:
      description: "Invalid request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Not authenticated or invalid credentials"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Forbidden"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Conflict"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "File too large"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: "Could not be processed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "Internal error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: "External service unavailable"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: "object"
      properties:
        message:
          type: "string"
          example: "invalid or expired token"
      required:
        - "message"
    MessageResponse:
      type: "object"
      properties:
        message:
          type: "string"
      required:
        - "message"
    CountResponse:
      type: "object"
      properties:
        total:
          type: "integer"
          format: "int64"
          example: 23
      required:
        - "total"
    Role:
      type: "string"
      enum:
        - "user"
        - "admin"
        - "super_admin"
    NotificationType:
      type: "string"
      enum:
        - "BUS_ARRIVAL"
        - "BUS_DELAY"
        - "LOCAL"
        - "GLOBAL"
        - "CAMERA"
    TerminalRef:
      type: "object"
      properties:
        uuid:
          type: "string"
          format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
        name:
          type: "string"
          example: "TERMINAL GUALEGUAYCHU"
      required:
        - "uuid"
        - "name"
    User:
      type: "object"
      properties:
        uuid:
          type: "string"
          format: "uuid"
        first_name:
          type: "string"
          example: "Juan"
        last_name:
          type: "string"
          example: "Pérez"
        email:
          type: "string"
          format: "email"
          example: "juan@gmail.com"
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
        terminals:
          type: "array"
          items:
            $ref: "#/components/schemas/TerminalRef"
          description: "Only for role `admin` with assigned terminals (omitted otherwise)"
      required:
        - "uuid"
        - "first_name"
        - "last_name"
        - "email"
        - "role"
        - "created_at"
        - "updated_at"
    CreateUserRequest:
      type: "object"
      properties:
        first_name:
          type: "string"
        last_name:
          type: "string"
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
      required:
        - "first_name"
        - "last_name"
        - "email"
        - "password"
    LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
      required:
        - "email"
        - "password"
    LoginResponse:
      type: "object"
      properties:
        access_token:
          type: "string"
          description: "HS256 JWT, 15 minutes"
        user:
          $ref: "#/components/schemas/User"
      required:
        - "access_token"
        - "user"
