        **Roles:** `admin, super_admin`

        Devuelve los datos de una ciudad específica identificada por su código postal.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Path param:**
        | Param | Tipo | Descripción |
        |---|---|---|
        | `postal_code` | string | Código postal de la ciudad |

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Busca la ciudad por `postal_code` en la base de datos.
        2. Si no existe devuelve `404`.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "postal_code": "2820",
          "name": "GUALEGUAYCHÚ"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no tiene rol `admin` ni `super_admin` |
        | `404 Not Found` | No existe una ciudad con ese código postal |
        | `500 Internal Server Error` | Error interno |
      operationId: "get_api_admin_cities_postal_code"
      security:
