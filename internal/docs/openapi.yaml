  /api/admin/notifications:
    get:
      tags:
        - "Notificaciones (admin)"
      summary: "Historial de notificaciones"
      description: |-
        **Roles:** `admin, super_admin`

        Lista las notificaciones para el panel de administración (historial), paginadas y ordenadas por fecha. A diferencia de `GET NOTIFICATIONS`, devuelve la terminal, el tipo y si expiró, e incluye las expiradas por defecto.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Query params:**
        | Param | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `page` | int | No | Número de página, empieza en 1 (default: `1`) |
        | `limit` | int | No | Elementos por página (default: `10`, máximo: `100`) |
        | `order` | string | No | Orden por fecha: `ASC` o `DESC` (default: `DESC`; cualquier otro valor se toma como `DESC`) |
        | `type` | string | No | `BUS_ARRIVAL`, `BUS_DELAY`, `LOCAL`, `GLOBAL` o `CAMERA` (no distingue mayúsculas) |
        | `terminal_uuid` | UUID | No | Filtra por terminal (incluye las de patente+terminal) |
        | `status` | string | No | `active` (vigentes), `expired` (expiradas) o `all` / vacío (todas, default) |

        **Comportamiento interno según rol:**
        - **`super_admin`:** Todas las notificaciones, incluidas las `GLOBAL`. Con `terminal_uuid`, solo las de esa terminal.
        - **`admin`:** Solo las de sus terminales (incluye `CAMERA`, no incluye `GLOBAL`). Si pasa `terminal_uuid` debe ser suya (`403`). Si no tiene terminales devuelve `400`.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "notifications": [
            {
              "id": "98fb4a77-0a0f-44f0-8067-59e5b7df42ba",
              "type": "LOCAL",
              "terminal": { "uuid": "a0000000-0000-0000-0000-000000000001", "name": "TERMINAL GUALEGUAYCHU" },
              "date": "2026-05-04T15:18:00Z",
              "expiration": "2026-05-04T15:30:00Z",
              "expired": true,
              "payload": { "id": "98fb4a77-0a0f-44f0-8067-59e5b7df42ba", "message": "Texto", "time_life": 12 }
            }
          ],
          "page": 1,
          "next": null,
          "prev": null,
          "elements": 1,
          "total_elements": 1
        }
        ```

        `terminal` es `null` en las notificaciones `GLOBAL`. **Paginación:** `next` y `prev` son el número de la página siguiente/anterior, o `null` si no existe. `elements` es la cantidad de ítems devueltos en esta página y `total_elements` el total sin paginar. Valores inválidos de `page`/`limit` se ignoran y se usan los defaults.

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | `type` o `status` inválidos, `terminal_uuid` no es UUID, admin sin terminal asignada |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | `terminal_uuid` no pertenece al admin, o rol no permitido |
        | `500 Internal Server Error` | Error interno |
      operationId: "get_api_admin_notifications"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Order"
        - name: "type"
          in: "query"
          required: false
          description: "Tipo de notificación (no distingue mayúsculas)."
          schema:
            $ref: "#/components/schemas/NotificationType"
        - name: "terminal_uuid"
          in: "query"
          required: false
          description: "Filtra por terminal."
          schema:
            type: "string"
            format: "uuid"
        - name: "status"
          in: "query"
          required: false
          description: "Estado de la notificación."
          schema:
            type: "string"
            enum:
              - "active"
              - "expired"
              - "all"
            default: "all"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminNotificationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - "Notificaciones (admin)"
      summary: "Enviar notificación LOCAL o GLOBAL"
      description: |-
        **Roles:** `admin, super_admin`

        Envía una notificación manual a los pasajeros. Soporta los tipos `LOCAL` (una terminal específica) y `GLOBAL` (todas las terminales, solo `super_admin`).

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Query params:**
        | Param | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `terminaluuid` | UUID | Condicional | Terminal destino (solo `LOCAL`). Requerido para `super_admin` y para `admin` con más de una terminal |

        **Body (JSON) — tipo LOCAL:**
        ```json
        {
          "type": "LOCAL",
          "payload": {
            "message": "Texto del mensaje",
            "time_life": 12
          }
        }
        ```

        **Body (JSON) — tipo GLOBAL** (solo `super_admin`, `terminaluuid` se ignora):
        ```json
        {
          "type": "GLOBAL",
          "payload": {
            "message": "Texto del mensaje",
            "time_life": 12
          }
        }
        ```

        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `type` | string | Sí | `LOCAL` o `GLOBAL` |
        | `payload.message` | string | Sí | Texto de la notificación |
        | `payload.time_life` | integer | Sí | Minutos de vida de la notificación (> 0) |

        En `GLOBAL` el payload puede tener campos extra, que se reenvían tal cual. En `LOCAL` solo se usan `message` y `time_life`. En ambos casos el backend agrega `payload.id` con el UUID de la notificación.

        **Comportamiento interno según tipo:**
        - **`LOCAL`:** Determina la terminal destino según el rol. Si el admin tiene una sola terminal y no se pasa `terminaluuid`, usa esa (si se pasa, debe ser esa misma: `403`). Si tiene varias, `terminaluuid` es obligatorio y debe ser suya. Persiste la notificación (`group_key = uuid_terminal`) y la envía por SignalR (`SendToFrontend`) al grupo `frontend/{uuid_terminal}`.
        - **`GLOBAL`:** Persiste la notificación con `group_key` nulo y la envía por SignalR (`SendToFrontendGlobal`) al grupo `frontend/global`.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "message": "notification sent"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Tipo inválido, payload vacío / no JSON, mensaje vacío, `time_life` inválido, `terminaluuid` faltante o inválido, admin sin terminal asignada |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | Admin intenta enviar notificación `GLOBAL`, o `terminaluuid` no le pertenece |
        | `404 Not Found` | Terminal no encontrada |
        | `502 Bad Gateway` | Error al persistir o enviar la notificación por SignalR |
