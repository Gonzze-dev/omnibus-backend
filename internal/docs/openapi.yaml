          description: "Exact user email"
          schema:
            type: "string"
            format: "email"
          example: "mendozamauro@gmail.com"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserByEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/users/promote:
    post:
      tags:
        - "User management"
      summary: "Promote to admin of a terminal"
      description: |-
        **Roles:** `admin, super_admin`

        Promotes a user to the `admin` role and associates them with a terminal. If the user was already admin of other terminals, the new one is added without overwriting the existing ones.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `email` | string | Yes | Email of the user to promote |
        | `bus_terminal_id` | UUID | Yes | Terminal they are associated with as admin |

        **Example:**
        ```json
        {
          "email": "user@gmail.com",
          "bus_terminal_id": "a0000000-0000-0000-0000-000000000001"
        }
        ```

        **Internal behavior by role:**
        - **`super_admin`:** Checks that the terminal exists (`404`). Can promote any user.
        - **`admin`:** Checks that the terminal is one of theirs; otherwise returns `403` (also if `bus_terminal_id` is missing or does not exist).

        **Common logic:**
        1. Validates that `email` is present.
        2. Looks up the user by email; if it does not exist returns `404`.
        3. If the user is already `super_admin`, returns `409`.
        4. Changes the user's role to `admin`.
        5. If the user is not associated with that terminal yet, creates the `user_terminal` relationship.

        The promoted user gets the new role in their JWT when they `REFRESH` or `LOGIN`.

        **Successful response `200 OK`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "role": "admin",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body or missing `email` |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The admin does not own that terminal |
        | `404 Not Found` | User or terminal not found |
        | `409 Conflict` | The user is already `super_admin` |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_admin_users_promote"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTerminalRequest"
            example:
              email: "user@gmail.com"
              bus_terminal_id: "a0000000-0000-0000-0000-000000000001"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/users/demote:
    post:
      tags:
        - "User management"
      summary: "Remove admin from a terminal"
      description: |-
        **Roles:** `admin, super_admin`

        Removes an admin's association with a terminal. If the admin no longer has any assigned terminal, their role goes back to `user` automatically.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `email` | string | Yes | Email of the admin to demote |
        | `bus_terminal_id` | UUID | Yes | Terminal they are removed from |

        **Example:**
        ```json
        {
          "email": "admin@gmail.com",
          "bus_terminal_id": "a0000000-0000-0000-0000-000000000002"
        }
        ```

        **Internal behavior by role:**
        - **`super_admin`:** Can demote any admin of any terminal.
        - **`admin`:** Can only demote admins of their own terminals (`403` if it is not theirs). Also, **they cannot demote themselves** (`400`).

        **Common logic:**
        1. Validates that `email` is present.
        2. Looks up the user by email; if it does not exist returns `404`.
        3. Checks that the user has role `admin`; otherwise returns `400`.
        4. Deletes the `user_terminal` relationship for that terminal (if it did not exist, does nothing).
        5. If the user no longer has any associated terminal, changes their role to `user`.

        **Successful response `200 OK`** (with the resulting role: `admin` if they still have terminals, `user` otherwise):
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "role": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body, missing `email`, the user is not admin, or the admin tries to demote themselves |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The admin does not own that terminal |
        | `404 Not Found` | User not found |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_admin_users_demote"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTerminalRequest"
            example:
              email: "admin@gmail.com"
              bus_terminal_id: "a0000000-0000-0000-0000-000000000002"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
