          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/super/terminals:
    get:
      tags:
        - "Terminales"
      summary: "Listar terminales"
      description: |-
        **Roles:** `super_admin`

        Devuelve las terminales registradas, paginadas y ordenadas por nombre.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `super_admin`).

        **Query params:**
        | Param | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `page` | int | No | Número de página, empieza en 1 (default: `1`) |
        | `limit` | int | No | Elementos por página (default: `10`, máximo: `100`) |
        | `order` | string | No | `ASC` o `DESC` (default: `DESC`; cualquier otro valor se toma como `DESC`) |

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "terminals": [
            {
              "uuid": "a0000000-0000-0000-0000-000000000001",
              "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
              "postal_code": "2820",
              "name": "TERMINAL GUALEGUAYCHU"
            }
          ],
          "page": 1,
          "next": null,
          "prev": null,
          "elements": 1,
          "total_elements": 1
        }
        ```

        **Paginación:** `next` y `prev` son el número de la página siguiente/anterior, o `null` si no existe. `elements` es la cantidad de ítems devueltos en esta página y `total_elements` el total sin paginar. Valores inválidos de `page`/`limit` se ignoran y se usan los defaults.

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `500 Internal Server Error` | Error interno |
      operationId: "get_api_super_terminals"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTerminalsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - "Terminales"
      summary: "Crear terminal"
      description: |-
        **Roles:** `super_admin`

        Crea una nueva terminal. El `external_terminal_id` debe existir en el backend de terminales (ver `GET EXTERNAL TERMINALS`) y no estar ya en uso.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `super_admin`).

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `postal_code` | string | Sí | Código postal de la ciudad donde está la terminal (debe existir en `city`) |
        | `name` | string | Sí | Nombre de la terminal. Se recortan espacios y se pasa a mayúsculas; solo letras, números y espacios |
        | `external_terminal_id` | UUID | Sí | ID de la terminal en el backend de terminales |

        **Ejemplo:**
        ```json
        {
          "postal_code": "2820",
          "name": "Terminal Retiro BS AS",
          "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6"
        }
        ```

        **Comportamiento interno:**
        1. Normaliza el `name` y valida los campos (en orden: `postal_code`, `name`, `external_terminal_id`).
        2. Verifica que el `external_terminal_id` no esté ya asociado a otra terminal; si existe devuelve `409`.
        3. Consulta al backend de terminales que el `external_terminal_id` exista; si no existe devuelve `400`.
        4. Verifica que el `postal_code` exista en la tabla de ciudades; si no devuelve `404`.
        5. Crea la terminal con un UUID nuevo.

        **Respuesta exitosa `201 Created`:**
        ```json
        {
          "uuid": "...",
          "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
          "postal_code": "2820",
          "name": "TERMINAL RETIRO BS AS"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado, campos faltantes, `name` con caracteres inválidos, o `external_terminal_id` inexistente en el backend de terminales |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `404 Not Found` | Ciudad con ese `postal_code` no encontrada |
        | `409 Conflict` | El `external_terminal_id` ya está en uso por otra terminal |
        | `502 Bad Gateway` | Error al consultar el backend de terminales |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_super_terminals"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTerminalRequest"
            example:
              postal_code: "2820"
              name: "Terminal Retiro BS AS"
              external_terminal_id: "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6"
      responses:
        "201":
          description: "Terminal creada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusTerminal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/super/terminals/count:
    get:
      tags:
        - "Terminales"
      summary: "Contar terminales"
      description: |-
        **Roles:** `super_admin`

        Devuelve la cantidad total de terminales registradas (equivale a `total_elements` de `LIST TERMINALS`).

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `super_admin`).

        **Body:** Ninguno.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "total": 12
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `500 Internal Server Error` | Error interno |
      operationId: "get_api_super_terminals_count"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/super/terminals/{uuid}:
    get:
      tags:
        - "Terminales"
      summary: "Obtener terminal"
      description: |-
        **Roles:** `super_admin`

        Devuelve los datos de una terminal específica por su UUID.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `super_admin`).

        **Path param:**
        | Param | Tipo | Descripción |
        |---|---|---|
        | `uuid` | UUID | UUID de la terminal |

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Parsea el UUID del path; si es inválido devuelve `400`.
        2. Busca la terminal en la base de datos; si no existe devuelve `404`.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "uuid": "a0000000-0000-0000-0000-000000000001",
          "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
          "postal_code": "2820",
          "name": "TERMINAL GUALEGUAYCHU"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | UUID con formato inválido |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `404 Not Found` | Terminal no encontrada |
        | `500 Internal Server Error` | Error interno |
      operationId: "get_api_super_terminals_uuid"
      security:
        - bearerAuth: []
      parameters:
        - name: "uuid"
          in: "path"
          required: true
          description: "UUID de la terminal"
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusTerminal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "Terminales"
      summary: "Actualizar terminal"
      description: |-
        **Roles:** `super_admin`

        Actualiza los datos de una terminal existente. Todos los campos son opcionales (un body vacío no modifica nada).

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `super_admin`).

        **Path param:**
        | Param | Tipo | Descripción |
        |---|---|---|
        | `uuid` | UUID | UUID de la terminal a modificar |

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `postal_code` | string | No | Nuevo código postal (debe existir en `city`) |
        | `name` | string | No | Nuevo nombre (mayúsculas; solo letras, números y espacios) |
        | `external_terminal_id` | UUID | No | Nuevo ID externo (debe existir en el backend de terminales y no estar en uso) |

        **Ejemplo:**
        ```json
        {
          "postal_code": "2820",
          "name": "Terminal Gualeguaychu",
          "external_terminal_id": "c11ea199-91e2-43d4-a72e-1ed619258ac5"
        }
        ```

        **Comportamiento interno:**
        1. Normaliza y valida `name` si viene; `external_terminal_id` no puede ser el UUID nulo.
        2. Busca la terminal por UUID; si no existe devuelve `404`.
        3. Si se cambia `postal_code`, verifica que la ciudad exista; si no devuelve `404`.
        4. Si se cambia `external_terminal_id` y es distinto al actual: verifica que no esté en uso por otra terminal (`409`) y que exista en el backend de terminales (`400` / `502`).
        5. Aplica los cambios y persiste.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "uuid": "a0000000-0000-0000-0000-000000000001",
          "external_terminal_id": "c11ea199-91e2-43d4-a72e-1ed619258ac5",
          "postal_code": "2820",
          "name": "TERMINAL GUALEGUAYCHU"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | UUID inválido, body malformado, `name` vacío o con caracteres inválidos, o `external_terminal_id` inexistente en el backend de terminales |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `404 Not Found` | Terminal o ciudad no encontrada |
        | `409 Conflict` | El `external_terminal_id` ya está en uso por otra terminal |
        | `502 Bad Gateway` | Error al consultar el backend de terminales |
        | `500 Internal Server Error` | Error interno |
      operationId: "put_api_super_terminals_uuid"
      security:
        - bearerAuth: []
      parameters:
        - name: "uuid"
          in: "path"
          required: true
          description: "UUID de la terminal"
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTerminalRequest"
            example:
              postal_code: "2820"
              name: "Terminal Gualeguaychu"
              external_terminal_id: "c11ea199-91e2-43d4-a72e-1ed619258ac5"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusTerminal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      tags:
        - "Terminales"
      summary: "Eliminar terminal"
      description: |-
        **Roles:** `super_admin`

        Elimina una terminal del sistema por su UUID.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `super_admin`).

        **Path param:**
        | Param | Tipo | Descripción |
        |---|---|---|
        | `uuid` | UUID | UUID de la terminal a eliminar |

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Parsea el UUID del path; si es inválido devuelve `400`.
        2. Verifica que la terminal exista; si no devuelve `404`.
        3. Elimina el registro de la base de datos.

        **Respuesta exitosa `204 No Content`:** Sin cuerpo.

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | UUID con formato inválido |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `404 Not Found` | Terminal no encontrada |
        | `500 Internal Server Error` | Error interno |
      operationId: "delete_api_super_terminals_uuid"
      security:
        - bearerAuth: []
      parameters:
        - name: "uuid"
          in: "path"
          required: true
          description: "UUID de la terminal"
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
      responses:
        "204":
          description: "Sin contenido"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/super/get-external-terminals:
    get:
      tags:
        - "Terminales"
      summary: "Listar terminales del sistema externo"
      description: |-
        **Roles:** `super_admin`

        Lista las terminales del backend de terminales (sistema externo de pasajes). Se usa para elegir el `external_terminal_id` al crear o editar una terminal.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `super_admin`).

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Llama a `GET {TERMINAL_API_URL}/terminal/`.
        2. Devuelve cada terminal con su `uuid` y el nombre normalizado (sin espacios al inicio/fin y en mayúsculas).

        No indica si la terminal externa ya está asociada a una terminal local.

        **Respuesta exitosa `200 OK`:**
        ```json
        [
          { "uuid": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6", "name": "TERMINAL CONCEPCIÓN DEL URUGUAY" },
          { "uuid": "c11ea199-91e2-43d4-a72e-1ed619258ac5", "name": "TERMINAL GUALEGUAYCHÚ" }
        ]
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `502 Bad Gateway` | El backend de terminales no responde o devuelve un error |
      operationId: "get_api_super_get_external_terminals"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ExternalTerminal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/super/users/promote-super:
    post:
      tags:
        - "Gestión de usuarios"
      summary: "Promover a super_admin"
      description: |-
        **Roles:** `super_admin`

        Promueve a un usuario al rol de `super_admin`. Si el usuario era `admin`, se eliminan todas sus asociaciones a terminales.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `super_admin`).

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `email` | string | Sí | Email del usuario a promover |

        **Ejemplo:**
        ```json
        {
          "email": "usuario@gmail.com"
        }
        ```

        **Comportamiento interno:**
        1. Valida que `email` esté presente.
        2. Busca al usuario por email; si no existe devuelve `404`.
        3. Si el usuario ya es `super_admin`, devuelve `409`.
        4. Cambia el rol del usuario a `super_admin`.
        5. Elimina todas las relaciones `user_terminal` del usuario (un `super_admin` no está vinculado a terminales específicas).

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "rol": "super_admin",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado, `email` faltante |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `404 Not Found` | Usuario no encontrado |
        | `409 Conflict` | El usuario ya es `super_admin` |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_super_users_promote_super"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            example:
              email: "usuario@gmail.com"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/super/users/demote-super:
    post:
      tags:
        - "Gestión de usuarios"
      summary: "Quitar rol super_admin"
      description: |-
        **Roles:** `super_admin`

        Quita el rol de `super_admin` a un usuario, degradándolo directamente a `user`.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `super_admin`).

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `email` | string | Sí | Email del super admin a degradar |

        **Ejemplo:**
        ```json
        {
          "email": "superadmin@gmail.com"
        }
        ```

        **Comportamiento interno:**
        1. Valida que `email` esté presente.
        2. Busca al usuario por email; si no existe devuelve `404`.
        3. Verifica que el usuario tenga rol `super_admin`; si no devuelve `400`.
        4. Cambia el rol del usuario a `user` directamente (sin pasar por `admin`). Un `super_admin` puede degradarse a sí mismo.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "rol": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado, `email` faltante o el usuario no es `super_admin` |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `404 Not Found` | Usuario no encontrado |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_super_users_demote_super"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            example:
              email: "superadmin@gmail.com"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Access token devuelto por `/api/auth/login` o `/api/auth/refresh`."
    recoveryToken:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Token de recuperación de contraseña (firmado con `PASSWORD_RESET_JWT_SECRET`)."
    cameraApiKey:
      type: "apiKey"
      in: "header"
      name: "X-API-Key"
      description: "API key del sistema de cámaras (`CAMERA_NOTIFICATION_API_KEY`)."
    refreshCookie:
      type: "apiKey"
      in: "cookie"
      name: "refresh_token"
      description: "Cookie `HttpOnly` seteada por login/refresh (path `/api/auth`)."
  parameters:
    Page:
      name: "page"
      in: "query"
      required: false
      description: "Número de página, empieza en 1."
      schema:
        type: "integer"
        minimum: 1
        default: 1
    Limit:
      name: "limit"
      in: "query"
      required: false
      description: "Elementos por página."
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 10
    Order:
      name: "order"
      in: "query"
      required: false
      description: "Orden (cualquier otro valor se toma como `DESC`)."
      schema:
        type: "string"
        enum:
          - "ASC"
          - "DESC"
        default: "DESC"
  responses:
    BadRequest:
      description: "Request inválido"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "No autenticado o credenciales inválidas"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Sin permisos"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Recurso no encontrado"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Conflicto"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "Archivo demasiado grande"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: "No se pudo procesar"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "Error interno"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: "Servicio externo no disponible"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: "object"
      properties:
        message:
          type: "string"
