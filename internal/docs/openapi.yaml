        | Param | Type | Required | Description |
        |---|---|---|---|
        | `bus_terminal_id` | UUID | No | If passed, the total is `1` |

        **Internal behavior by role:**
        - **`super_admin`:** Total number of terminals in the system. With `bus_terminal_id`, checks that it exists (`404`) and returns `1`.
        - **`admin`:** Total number of terminals they manage. With `bus_terminal_id`, checks that it is theirs (`403`) and returns `1`.

        **Successful response `200 OK`:**
        ```json
        {
          "total": 3
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | `bus_terminal_id` with an invalid format |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The admin does not own that terminal |
        | `404 Not Found` | Terminal not found (`super_admin`) |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_platforms_count"
      security:
        - bearerAuth: []
      parameters:
        - name: "bus_terminal_id"
          in: "query"
          required: false
          description: "Filters by a specific terminal."
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
