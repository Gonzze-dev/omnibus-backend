      description: |-
        **Roles:** `admin, super_admin`

        Devuelve los usuarios del sistema, paginados y ordenados por nombre y apellido, con su rol y las terminales que administran.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

