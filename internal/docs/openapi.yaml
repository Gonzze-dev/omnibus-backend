  /api/admin/users/by-email:
    get:
      tags:
        - "Gestión de usuarios"
      summary: "Buscar usuario por email"
      description: |-
        **Roles:** `admin, super_admin`

        Busca un usuario por email y devuelve un resumen: nombre completo, rol y, si es `admin`, los nombres de las terminales que administra. Se usa antes de promover/degradar.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`, sin restricción de terminal).

        **Query params:**
        | Param | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `email` | string | Sí | Email del usuario (se recortan espacios; búsqueda exacta) |

        **Respuesta exitosa `200 OK` — usuario `admin`:**
        ```json
        {
          "name": "Mauro Mendoza",
          "email": "mendozamauro@gmail.com",
          "role": "admin",
          "terminals": ["TERMINAL GUALEGUAYCHU", "TERMINAL RETIRO BS AS"]
        }
        ```

        Para otros roles (o un admin sin terminales) el campo `terminals` se omite.

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Parámetro `email` ausente o vacío |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El rol del token no es `admin` ni `super_admin` |
        | `404 Not Found` | No existe ningún usuario con ese email |
        | `500 Internal Server Error` | Error interno |
      operationId: "get_api_admin_users_by_email"
      security:
        - bearerAuth: []
      parameters:
        - name: "email"
          in: "query"
