        |---|---|---|---|
        | `page` | int | No | Número de página, empieza en 1 (default: `1`) |
        | `limit` | int | No | Elementos por página (default: `10`, máximo: `100`) |
        | `order` | string | No | `ASC` o `DESC` (default: `DESC`; cualquier otro valor se toma como `DESC`) |
        | `search` | string | No | Filtra por nombre completo (`first_name last_name`) o email, sin distinguir mayúsculas (contiene) |

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "users": [
            {
              "uuid": "...",
              "first_name": "Mauro",
              "last_name": "Mendoza",
              "email": "mendozamauro@gmail.com",
              "rol": "admin",
              "terminals": [
                { "uuid": "a0000000-0000-0000-0000-000000000001", "name": "TERMINAL GUALEGUAYCHU" }
              ]
            }
          ],
          "page": 1,
          "next": 2,
          "prev": null,
          "elements": 10,
          "total_elements": 42
        }
