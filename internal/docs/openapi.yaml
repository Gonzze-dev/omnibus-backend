        Devuelve los tipos de notificación que el usuario autenticado puede enviar según su rol (para armar el selector del panel).

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Body:** Ninguno.

        **Comportamiento interno:**
        - **`super_admin`:** `LOCAL`, `GLOBAL`, `BUS_DELAY` y `BUS_ARRIVAL`.
        - **`admin`:** `LOCAL`, `BUS_DELAY` y `BUS_ARRIVAL`.

