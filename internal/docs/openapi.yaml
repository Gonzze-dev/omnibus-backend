# Especificación OpenAPI del backend. Se sirve en GET /docs (Swagger UI) y GET /docs/openapi.yaml.
# Las descripciones de cada endpoint provienen de backend.postman_collection.json.
openapi: "3.0.3"
info:
  title: "Omnibus Backend API"
  version: "1.0.0"
  description: |-
    API del backend de omnibus: autenticación, gestión de terminales, ciudades y andenes, notificaciones en tiempo real a pasajeros y administradores, e integración con cámaras y OCR.

    **Autenticación**

    - `bearerAuth`: access token JWT obtenido en `POST /api/auth/login` (15 minutos). Se renueva con `POST /api/auth/refresh` usando la cookie `refresh_token`.
    - `recoveryToken`: JWT de recuperación de contraseña recibido por mail (30 minutos).
    - `cameraApiKey`: header `X-API-Key` del sistema de cámaras.

    **Errores:** todas las respuestas de error tienen la forma `{"message": "..."}`.
servers:
  - url: "/"
    description: "Servidor donde se sirve esta documentación"
  - url: "http://localhost:4989"
    description: "Local"
tags:
  - name: "Sistema"
    description: "Health check"
  - name: "Auth"
    description: "Registro, login, refresh y recuperación de contraseña"
  - name: "Pasajes"
    description: "Consulta de pasajes al backend de terminales"
  - name: "Usuario"
    description: "Endpoints para cualquier usuario autenticado"
  - name: "Ciudades"
    description: "ABM de ciudades (lectura: admin y super_admin; escritura: solo super_admin)"
  - name: "Plataformas"
    description: "ABM de plataformas (andenes)"
  - name: "Gestión de usuarios"
    description: "Listado y cambio de roles"
  - name: "Estadísticas"
    description: "Totales para el dashboard"
  - name: "Notificaciones (admin)"
    description: "Envío, historial y borrado de notificaciones"
  - name: "Cámaras"
    description: "Endpoints invocados por el sistema de cámaras (X-API-Key)"
  - name: "Terminales"
    description: "ABM de terminales (solo super_admin)"
paths:
  /:
    get:
      tags:
        - "Sistema"
      summary: "Redirige al health check"
      description: |-
        Redirige a `/health`. Sirve para que abrir la URL base del backend en el navegador muestre el health check.

        **Autenticación:** No requerida.

        **Respuesta:** `302 Found` con header `Location: /health` (Postman sigue la redirección y muestra `OK`).
      operationId: "get_root"
      security: []
      responses:
        "302":
          description: "Redirección a `/health`"
          headers:
            Location:
              schema:
                type: "string"
                example: "/health"
  /health:
    get:
      tags:
        - "Sistema"
      summary: "Health check"
      description: |-
        Verifica que el servidor esté levantado y respondiendo.

        **Autenticación:** No requerida.

        **Body:** Ninguno.

        **Respuesta exitosa `200 OK`** (texto plano, `Content-Type: text/plain`):
        ```
        OK
        ```

        `GET /` redirige aquí (`302 Found` → `/health`).
      operationId: "get_health"
      security: []
      responses:
        "200":
          description: "Servidor levantado"
          content:
            text/plain:
              schema:
                type: "string"
                example: "OK"
  /api/auth/register:
    post:
      tags:
        - "Auth"
      summary: "Registrar usuario"
      description: |-
        Registra un nuevo usuario con rol `user`.

        **Autenticación:** No requerida.

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `first_name` | string | Sí | Nombre |
        | `last_name` | string | Sí | Apellido |
        | `email` | string | Sí | Email único |
        | `password` | string | Sí | Contraseña (se hashea con bcrypt) |

        **Comportamiento interno:**

        1. Valida que todos los campos estén presentes (en orden: `email`, `password`, `first_name`, `last_name`).
        2. Verifica que el email no esté registrado; si ya existe devuelve `409`.
        3. Obtiene el rol `user` de la base de datos.
        4. Hashea la contraseña con bcrypt (costo por defecto).
        5. Crea el usuario con un UUID nuevo y persiste en la base de datos.

        No inicia sesión: para obtener un token hay que llamar a `LOGIN`.

        **Respuesta exitosa `201 Created`:**

        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "rol": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado o campos faltantes |
        | `409 Conflict` | El email ya está registrado |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_auth_register"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              first_name: "Juan"
              last_name: "Pérez"
              email: "juan@gmail.com"
              password: "1234"
      responses:
        "201":
          description: "Usuario creado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags:
        - "Auth"
      summary: "Iniciar sesión"
      description: |-
        Autentica a un usuario y devuelve un access token JWT. El refresh token **no** viaja en el body: se setea como cookie `HttpOnly`.

        **Autenticación:** No requerida.

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `email` | string | Sí | Email del usuario |
        | `password` | string | Sí | Contraseña en texto plano |

        **Comportamiento interno:**

        1. Valida que email y password estén presentes.
        2. Busca al usuario por email; si no existe devuelve `401`.
        3. Compara la contraseña con el hash bcrypt almacenado.
        4. Genera un **access token** JWT (HS256) con duración de **15 minutos** que incluye el UUID (`user_id`) y el rol (`role`) del usuario.
        5. Genera un **refresh token** (UUID), lo hashea con SHA-256 y lo persiste en la base de datos (upsert: una sesión por usuario) con expiración de **7 días**.
        6. Setea el refresh token como cookie `HttpOnly` (`refresh_token`, path `/api/auth`, `SameSite=Lax`, 7 días).

        El script de tests guarda `access_token` en la variable de colección `token`.

        **Respuesta exitosa `200 OK`:**

        ```json
        {
          "access_token": "<JWT>",
          "user": {
            "uuid": "...",
            "first_name": "...",
            "last_name": "...",
            "email": "...",
            "rol": "super_admin",
            "created_at": "2026-05-04T15:30:00Z",
            "updated_at": "2026-05-04T15:30:00Z"
          }
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado o campos faltantes |
        | `401 Unauthorized` | Email no registrado o contraseña incorrecta |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_auth_login"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "juan@gmail.com"
              password: "1234"
      responses:
        "200":
          description: "Login correcto. El refresh token se setea como cookie `HttpOnly`."
          headers:
            Set-Cookie:
              description: "`refresh_token=<token>; Path=/api/auth; HttpOnly; SameSite=Lax; Max-Age=604800`"
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/refresh:
    post:
      tags:
        - "Auth"
      summary: "Renovar access token"
      description: |-
        Renueva el access token usando el refresh token almacenado en cookie. No requiere body ni header de autorización.

        **Autenticación:** Cookie `refresh_token` (seteada automáticamente por `/login` o una llamada previa a este mismo endpoint).

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Lee el refresh token de la cookie `refresh_token`. Si no existe devuelve `401`.
        2. Hashea el token con SHA-256 y lo busca en la base de datos.
        3. Verifica que no haya expirado (duración: **7 días**). Si expiró, elimina el registro y devuelve `401`.
        4. Genera un nuevo **access token** JWT (15 min, con el rol actual del usuario) y un nuevo **refresh token** (rotación de token).
        5. Actualiza el registro en la base de datos (upsert) y renueva la cookie `refresh_token`.

        El script de tests guarda `access_token` en la variable de colección `token`.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "access_token": "<nuevo JWT>"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Cookie ausente, token inválido o expirado |
        | `500 Internal Server Error` | Error interno (incluye usuario eliminado) |
      operationId: "post_api_auth_refresh"
      security:
        - refreshCookie: []
      responses:
        "200":
          description: "Token renovado (rota también la cookie `refresh_token`)."
          headers:
            Set-Cookie:
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags:
        - "Auth"
      summary: "Cerrar sesión"
      description: |-
        Cierra la sesión del usuario invalidando su refresh token. No requiere body ni header de autorización.

        **Autenticación:** Cookie `refresh_token`.

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Lee el refresh token de la cookie `refresh_token`. Si no existe devuelve `401`.
        2. Hashea el token con SHA-256 y busca el registro en la base de datos.
        3. Elimina el refresh token del usuario de la base de datos (invalida la sesión).
        4. Limpia la cookie `refresh_token` del cliente (MaxAge = -1).

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "message": "logged out successfully"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Cookie ausente o refresh token inválido |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_auth_logout"
      security:
        - refreshCookie: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "logged out successfully"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/forgot-password:
    post:
      tags:
        - "Auth"
      summary: "Solicitar recuperación de contraseña"
      description: |-
        Inicia el flujo de recuperación de contraseña: si el email existe, le envía un correo con un link para restablecerla.

        **Autenticación:** No requerida.

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `email` | string | Sí | Email de la cuenta (se recortan espacios) |

        **Comportamiento interno:**
        1. Valida que `email` no esté vacío; si lo está devuelve `400`.
        2. Busca al usuario por email. **Si no existe responde igual `200`** (no revela qué emails están registrados).
        3. Firma un JWT de recuperación (HS256, `PASSWORD_RESET_JWT_SECRET`) con el `user_id` y expiración de **30 minutos**.
        4. Arma el link `{FRONT_END_BASE_LINK}/reset-password?token=<TOKEN>` y envía el mail con la plantilla `ResetPasswordTemplate.html`.
        5. Si falta configuración (`PASSWORD_RESET_JWT_SECRET`, `FRONT_END_BASE_LINK` o SMTP) o el envío falla, solo se loguea el error: la respuesta sigue siendo `200`.

        Para probar el resto del flujo, copiar el token del link a la variable `TOKEN_RECOVER_PASS`.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "message": "correo enviado"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado o `email` vacío |
        | `500 Internal Server Error` | Error al consultar la base de datos |
      operationId: "post_api_auth_forgot_password"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
            example:
              email: "juan@gmail.com"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "correo enviado"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/validate-recovery-token:
    post:
      tags:
        - "Auth"
      summary: "Validar token de recuperación"
      description: |-
        Valida si un token de recuperación de contraseña es válido y no ha expirado. Este token se obtiene a través de `FORGOT PASSWORD`, que envía un email con el link `{FRONT_END_BASE_LINK}/reset-password?token=<TOKEN>`.

        **Autenticación:** `Authorization: Bearer <TOKEN_RECOVER_PASS>` — JWT especial firmado con `PASSWORD_RESET_JWT_SECRET` (no es el access token de login).

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Extrae el token del header `Authorization` (esquema Bearer).
        2. Parsea el JWT usando `PASSWORD_RESET_JWT_SECRET` con algoritmo HS256.
        3. Verifica que la firma sea válida, que el `user_id` no sea nulo y que el token no haya expirado (duración: **30 minutos** desde su emisión).
        4. Si todo es válido, devuelve la fecha de expiración (UTC).

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "valid": true,
          "expires_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Header `Authorization` ausente o sin formato `Bearer <token>`, o token inválido, con firma incorrecta o expirado (también si `PASSWORD_RESET_JWT_SECRET` no está configurado) |
      operationId: "post_api_auth_validate_recovery_token"
      security:
        - recoveryToken: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateRecoveryTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/reset-password:
    post:
      tags:
        - "Auth"
      summary: "Restablecer contraseña"
      description: |-
        Cambia la contraseña del usuario usando el token de recuperación recibido por mail.

        **Autenticación:** `Authorization: Bearer <TOKEN_RECOVER_PASS>` — JWT de recuperación (firmado con `PASSWORD_RESET_JWT_SECRET`).

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `password` | string | Sí | Nueva contraseña (no puede ser vacía ni solo espacios) |

        **Comportamiento interno:**
        1. Extrae el token del header `Authorization`; si falta o no es `Bearer <token>` devuelve `401`.
        2. Valida que `password` no esté vacía (`400`).
        3. Valida el token (firma, `user_id` y expiración de 30 minutos); si es inválido devuelve `401`.
        4. Busca al usuario; si ya no existe devuelve `401`.
        5. Hashea la nueva contraseña con bcrypt y la guarda.
        6. Elimina el refresh token del usuario: **cierra todas sus sesiones** abiertas.

        El token sigue siendo válido hasta que expira (no es de un solo uso).

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "message": "password updated"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado o `password` vacía |
        | `401 Unauthorized` | Header ausente/mal formado, token inválido o expirado, o usuario inexistente |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_auth_reset_password"
      security:
        - recoveryToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            example:
              password: "nuevaPass123"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "password updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /bus_tickets/{ticket_string}:
    get:
      tags:
        - "Pasajes"
      summary: "Consultar pasaje (proxy al backend de terminales)"
      description: |-
        Consulta un pasaje en el backend de terminales y devuelve su información. Es un proxy: reenvía `GET /bus_tickets/{ticket_string}` al servicio externo (`TERMINAL_API_URL`) y devuelve el mismo código de estado.

        **Autenticación:** No requerida.

        **Path param:**
        | Param | Tipo | Descripción |
        |---|---|---|
        | `ticket_string` | string | Código del pasaje (ej: `SUV-226780488-0`). En Postman usa la variable de colección `{{ticket}}` |

        **Comportamiento interno:**
        1. Llama al backend de terminales con el código del pasaje.
        2. Si la respuesta es `200`, normaliza los datos: `bus_terminal_name`, `ticket`, `name`, `enterprise` y `trip_city[].city_name` en mayúsculas; `bus_license_plate` en mayúsculas y sin espacios.
        3. Devuelve el body y el status del servicio externo tal cual (si el body no es JSON lo envuelve en `{ "data": "..." }`; si está vacío responde sin cuerpo).

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "postal_code": "3260",
          "bus_terminal_name": "TERMINAL CONCEPCIÓN DEL URUGUAY",
          "terminal_uuid": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
          "ticket": "SUV-226780488-0",
          "dni": "40111222",
          "name": "GONZALO ERRANDONEA",
          "bus_license_plate": "AF226GU",
          "enterprise": "NUEVO EXPRESO",
          "start_date": "2026-09-27T20:00:00",
          "end_date": "2026-09-28T01:30:00",
          "trip_city": [
            { "city_name": "GUALEGUAYCHÚ", "start_date": "2026-09-27T21:00:00", "end_date": "2026-09-27T21:15:00", "order": 2 }
          ],
          "uuid": "3dfad7a5-aafb-4c18-8e03-847687814886"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `404 Not Found` | (del servicio externo) El pasaje no existe |
        | `500 Internal Server Error` | No se pudo contactar al backend de terminales |
      operationId: "get_bus_tickets_ticket_string"
      security: []
      parameters:
        - name: "ticket_string"
          in: "path"
          required: true
          description: "Código del pasaje"
          schema:
            type: "string"
          example: "SUV-226780488-0"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusTicket"
        "404":
          description: "El pasaje no existe en el backend de terminales"
        default:
          description: "Status y body devueltos tal cual por el backend de terminales"
          content:
            application/json:
              schema:
                type: "object"
  /api/users/me:
    get:
      tags:
        - "Usuario"
      summary: "Obtener perfil"
      description: |-
        Devuelve la información del perfil del usuario autenticado. Si el usuario es `admin`, incluye además la lista de terminales que administra.

        **Autenticación:** `Authorization: Bearer {{token}}` (cualquier rol).

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Obtiene el UUID del usuario desde el JWT.
        2. Busca el usuario en la base de datos; si no existe devuelve `404`.
        3. Si el rol es `admin`, consulta las terminales asociadas al usuario y las incluye en `terminals` (el campo se omite si no tiene ninguna o si el rol es otro).

        **Respuesta exitosa `200 OK` — rol `user` o `super_admin`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "rol": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Respuesta exitosa `200 OK` — rol `admin`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "rol": "admin",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z",
          "terminals": [
            { "uuid": "a0000000-0000-0000-0000-000000000001", "name": "TERMINAL RETIRO BS AS" }
          ]
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `404 Not Found` | Usuario no encontrado |
        | `500 Internal Server Error` | Error interno |
      operationId: "get_api_users_me"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "Usuario"
      summary: "Actualizar perfil"
      description: |-
        Actualiza los datos del perfil del usuario autenticado. Todos los campos son opcionales, pero al menos uno debe enviarse.

        **Autenticación:** `Authorization: Bearer {{token}}` (cualquier rol).

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `first_name` | string | No | Nuevo nombre |
        | `last_name` | string | No | Nuevo apellido |
        | `email` | string | No | Nuevo email (debe ser único) |
        | `password` | string | No | Nueva contraseña (se hashea con bcrypt) |

        **Ejemplo:**
        ```json
        {
          "first_name": "Juan",
          "last_name": "Pérez",
          "email": "nuevo@gmail.com",
          "password": "nuevaPass123"
        }
        ```

        **Comportamiento interno:**
        1. Valida que al menos un campo esté presente y que ninguno de los enviados sea `""`; si no devuelve `400`.
        2. Busca al usuario en la base de datos por UUID del token; si no existe devuelve `404`.
        3. Aplica solo los campos presentes (patch parcial).
        4. Si se cambia `email`, verifica que no esté en uso por otro usuario; si existe devuelve `409`.
        5. Si se cambia `password`, la hashea con bcrypt antes de guardar (las sesiones abiertas no se cierran).

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "uuid": "...",
          "first_name": "...",
          "last_name": "...",
          "email": "...",
          "rol": "user",
          "created_at": "2026-05-04T15:30:00Z",
          "updated_at": "2026-05-04T15:30:00Z"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body vacío, o algún campo enviado está vacío |
        | `401 Unauthorized` | Token ausente o inválido |
        | `404 Not Found` | Usuario no encontrado |
        | `409 Conflict` | El email ya está en uso por otro usuario |
        | `500 Internal Server Error` | Error interno |
      operationId: "put_api_users_me"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              first_name: "Juan"
              last_name: "Pérez"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - "Usuario"
      summary: "Eliminar cuenta"
      description: |-
        Elimina la cuenta del usuario autenticado de forma permanente.

        **Autenticación:** `Authorization: Bearer {{token}}`.

        **Body:** Ninguno.

        **Comportamiento interno:**
        1. Obtiene el UUID del usuario desde el JWT.
        2. Verifica que el usuario exista en la base de datos; si no existe devuelve `404`.
        3. Elimina el refresh token del usuario (cierra la sesión activa).
        4. Elimina el registro del usuario de la base de datos.

        El access token ya emitido sigue siendo válido hasta que expira (15 min), pero los endpoints que buscan al usuario devolverán `404`.

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "message": "account deleted successfully"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `404 Not Found` | El usuario no existe |
        | `500 Internal Server Error` | Error interno |
      operationId: "delete_api_users_me"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "account deleted successfully"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/terminals:
