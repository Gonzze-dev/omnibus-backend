  /api/admin/platforms/{code}:
    get:
      tags:
        - "Platforms"
      summary: "Get platform"
      description: |-
        **Roles:** `admin, super_admin`

        Returns a platform (bay) by its code, within its terminal.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `code` | integer | Numeric code of the platform |

        **Body:** None.

        **Internal behavior by role:**

        - **`super_admin`:** Gets the platform directly with no terminal restriction.
        - **`admin`:** Gets the platform and checks that the terminal it belongs to is managed by the user; otherwise returns `403`.

        **Successful response `200 OK`:**

        ```json
        {
          "uuid": "a0000000-0000-0000-0000-000000000001",
          "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
          "postal_code": "2820",
          "name": "TERMINAL GUALEGUAYCHU",
          "platforms": [
            {
              "code": 16,
              "bay": "B3",
              "coordinates": { "lat": -34.6037, "lng": -58.3816 }
            }
          ]
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | The `code` is not a valid number |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The admin does not own that platform's terminal |
        | `404 Not Found` | Platform not found |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_platforms_code"
      security:
        - bearerAuth: []
      parameters:
        - name: "code"
          in: "path"
          required: true
          description: "Numeric code of the platform"
          schema:
            type: "integer"
          example: 13
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalWithPlatforms"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "Platforms"
      summary: "Update platform"
      description: |-
        **Roles:** `admin, super_admin`

        Updates the data of an existing platform (bay). Both fields are optional.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `code` | integer | Numeric code of the platform to update |

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `bay` | string | No | New bay identifier (uppercase; only letters, numbers and `-`) |
        | `coordinates` | object | No | New coordinates `{ "lat": float, "lng": float }` |

        **Example:**
        ```json
        {
          "bay": "B2",
          "coordinates": { "lat": -34.6037, "lng": -58.3816 }
        }
        ```

        **Internal behavior by role:**
        - **`super_admin`:** Looks up the platform by code and applies the changes directly.
        - **`admin`:** Looks up the platform, checks that the terminal it belongs to is the admin's; otherwise returns `403`. Then applies the changes.

        The platform cannot be moved to another terminal.

        **Successful response `200 OK`:**
        ```json
        {
          "code": 13,
          "bay": "B2",
          "coordinates": { "lat": -34.6037, "lng": -58.3816 },
          "bus_terminal_id": "a0000000-0000-0000-0000-000000000001"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Non-numeric `code`, malformed body, or `bay` empty / with invalid characters |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The admin does not own that platform's terminal |
        | `404 Not Found` | Platform not found |
        | `500 Internal Server Error` | Internal error |
      operationId: "put_api_admin_platforms_code"
      security:
        - bearerAuth: []
      parameters:
        - name: "code"
          in: "path"
          required: true
          description: "Numeric code of the platform"
          schema:
            type: "integer"
          example: 13
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformRequest"
            example:
              bay: "B2"
              coordinates:
                lat: -34.6037
                lng: -58.3816
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - "Platforms"
      summary: "Delete platform"
      description: |-
        **Roles:** `admin, super_admin`

        Deletes a platform (bay) from the system by its numeric code.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `code` | integer | Numeric code of the platform to delete |

        **Body:** None.

        **Internal behavior by role:**
        - **`super_admin`:** Checks that the platform exists and deletes it directly.
        - **`admin`:** Checks that the platform exists and that the terminal it belongs to is the admin's; otherwise returns `403`. Then deletes it.

        **Successful response `204 No Content`:** No body.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | The `code` is not a valid number |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The admin does not own that platform's terminal |
        | `404 Not Found` | Platform not found |
        | `500 Internal Server Error` | Internal error |
      operationId: "delete_api_admin_platforms_code"
      security:
        - bearerAuth: []
      parameters:
        - name: "code"
          in: "path"
          required: true
          description: "Numeric code of the platform"
          schema:
            type: "integer"
          example: 13
      responses:
        "204":
          description: "No content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/users:
    get:
      tags:
        - "User management"
      summary: "List users"
      description: |-
        **Roles:** `admin, super_admin`

        Returns the system's users, paginated and ordered by first and last name, with their role and the terminals they manage.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Query params:**
        | Param | Type | Required | Description |
        |---|---|---|---|
        | `page` | int | No | Page number, starts at 1 (default: `1`) |
        | `limit` | int | No | Items per page (default: `10`, maximum: `100`) |
        | `order` | string | No | `ASC` or `DESC` (default: `DESC`; any other value is treated as `DESC`) |
        | `search` | string | No | Filters by full name (`first_name last_name`) or email, case-insensitively (contains) |

        **Successful response `200 OK`:**
        ```json
        {
          "users": [
            {
              "uuid": "...",
              "first_name": "Mauro",
              "last_name": "Mendoza",
              "email": "mendozamauro@gmail.com",
              "role": "admin",
              "terminals": [
                { "uuid": "a0000000-0000-0000-0000-000000000001", "name": "TERMINAL GUALEGUAYCHU" }
              ]
            }
          ],
          "page": 1,
          "next": 2,
          "prev": null,
          "elements": 10,
          "total_elements": 42
        }
        ```

        `terminals` is always present (`[]` if the user manages none). **Pagination:** `next` and `prev` are the number of the next/previous page, or `null` if there is none. `elements` is the number of items returned in this page and `total_elements` the unpaginated total. Invalid `page`/`limit` values are ignored and the defaults are used.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user does not have role `admin` or `super_admin` |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_users"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Order"
        - name: "search"
          in: "query"
          required: false
          description: "Filters by full name or email (contains, case-insensitive)."
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
