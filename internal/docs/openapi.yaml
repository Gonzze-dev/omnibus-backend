      tags:
        - "Platforms"
      summary: "Count terminals with visible platforms"
      description: |-
        **Roles:** `admin, super_admin`

        Returns the total number of `LIST PLATFORMS` elements with the same filter, to build the pagination. **It counts terminals (groups), not bays**; for the total number of bays use `TOTAL PLATFORMS`.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

