        **Respuesta exitosa:** `204 No Content` (también si no esperaba ningún viaje).

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `500 Internal Server Error` | Error interno |
      operationId: "delete_api_buses_awaited"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "Sin contenido"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/cities:
    get:
      tags:
        - "Ciudades"
      summary: "Listar ciudades"
      description: |-
        **Roles:** `admin, super_admin`

        Devuelve las ciudades registradas, paginadas y ordenadas por nombre.

        **Autenticación:** `Authorization: Bearer {{token}}` (rol `admin` o `super_admin`).

        **Body:** Ninguno.

        **Query params:**
        | Param | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `page` | int | No | Número de página, empieza en 1 (default: `1`) |
        | `limit` | int | No | Elementos por página (default: `10`, máximo: `100`) |
        | `order` | string | No | `ASC` o `DESC` (default: `DESC`; cualquier otro valor se toma como `DESC`) |

        **Respuesta exitosa `200 OK`:**
        ```json
        {
          "cities": [
            { "postal_code": "2820", "name": "GUALEGUAYCHÚ" }
          ],
          "page": 1,
          "next": 2,
          "prev": null,
          "elements": 10,
          "total_elements": 23
        }
        ```

        **Paginación:** `next` y `prev` son el número de la página siguiente/anterior, o `null` si no existe. `elements` es la cantidad de ítems devueltos en esta página y `total_elements` el total sin paginar. Valores inválidos de `page`/`limit` se ignoran y se usan los defaults.

        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no tiene rol `admin` ni `super_admin` |
        | `500 Internal Server Error` | Error interno |
      operationId: "get_api_admin_cities"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - "Ciudades"
      summary: "Crear ciudad"
      description: |-
        **Roles:** `super_admin`

        Crea una nueva ciudad en el sistema.

        **Autenticación:** `Authorization: Bearer {{token}}` (**solo `super_admin`**: modificar ciudades afecta a terminales de todos los admins).

        **Body (JSON):**
        | Campo | Tipo | Requerido | Descripción |
        |---|---|---|---|
        | `postal_code` | string | Sí | Código postal único de la ciudad |
        | `name` | string | Sí | Nombre de la ciudad (se guarda en mayúsculas) |

        **Ejemplo:**
        ```json
        {
          "postal_code": "1004",
          "name": "Buenos Aires 1004"
        }
        ```

        **Comportamiento interno:**
        1. Valida que `postal_code` y `name` estén presentes.
        2. Verifica que no exista ya una ciudad con ese `postal_code`; si existe devuelve `409`.
        3. Pasa el `name` a mayúsculas y persiste la nueva ciudad.

        **Respuesta exitosa `201 Created`:**
        ```json
        {
          "postal_code": "1004",
          "name": "BUENOS AIRES 1004"
        }
        ```

        **Errores:**
        | Código | Causa |
        |---|---|
        | `400 Bad Request` | Body malformado, `postal_code` o `name` faltantes |
        | `401 Unauthorized` | Token ausente o inválido |
        | `403 Forbidden` | El usuario no es `super_admin` |
        | `409 Conflict` | Ya existe una ciudad con ese código postal |
        | `500 Internal Server Error` | Error interno |
      operationId: "post_api_admin_cities"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
            example:
              postal_code: "1004"
              name: "Buenos Aires 1004"
      responses:
        "201":
          description: "Ciudad creada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
