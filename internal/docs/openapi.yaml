        **Errores:**
        | Código | Causa |
        |---|---|
        | `401 Unauthorized` | Token ausente o inválido |
        | `404 Not Found` | El usuario no espera ningún viaje, o la terminal ya no existe / el pasaje ya no existe en el backend de terminales |
        | `502 Bad Gateway` | El backend de terminales no responde |
      operationId: "get_api_buses_awaited"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwaitedTripResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      tags:
        - "Usuario"
      summary: "Dejar de esperar el viaje"
      description: |-
        El usuario deja de esperar su viaje ("Buscar otro viaje" en el frontend). A partir de ahí no recibe el mail de llegada.

