  /api/notifications:
    get:
      tags:
        - "User"
      summary: "List visible notifications"
      description: |-
        Returns the notifications visible to the authenticated user, with filters and offset pagination. Ordered by date descending. Visibility depends on the role.

        **Authentication:** `Authorization: Bearer {{token}}` (any role).

        **Body:** None.

        **Query params:**

        | Param | Type | Required | Description |
        | --- | --- | --- | --- |
        | `terminalID` | UUID | Yes (role `user`) | UUID of the terminal to query. Ignored for `admin` and `super_admin` |
        | `expirated_notifications` | string | No | Exactly `true` (lowercase) returns only expired ones; any other value or omitting it returns only current ones |
        | `license_plate` | string | No | Filters by license plate (normalized: uppercase, no spaces) |
        | `start_date` | string | No | Start date `YYYY-MM-DD` |
        | `end_date` | string | No | End date `YYYY-MM-DD` (>= `start_date`). Ignored if there is no `start_date` |
        | `limit` | int | No | Results per page (default: 10) |
        | `offset` | int | No | Offset (default: 0) |
        | `notification_type` | string | No | `BUS_ARRIVAL`, `BUS_DELAY`, `LOCAL`, `GLOBAL` or `CAMERA` (case-sensitive) |

        **Internal behavior by role:**

        - **`user`:** Requires `terminalID`. Returns the `GLOBAL` ones (null group_key), the terminal's ones (`LOCAL`) and the plate+terminal ones (`BUS_ARRIVAL`, `BUS_DELAY`). If `license_plate` is passed, of the plate+terminal ones it only returns those of that plate. Excludes notifications of admin groups (`CAMERA`).
        - **`admin`:** Notifications of the terminals they manage (includes `CAMERA`, does not include `GLOBAL`). With `license_plate`, only those of that plate in their terminals (plus the terminal ones). If they have no terminals returns `400`.
        - **`super_admin`:** No terminal restriction. With `license_plate`, filters by that plate in any terminal.

        The internal `id` field is removed from `data.payload`.

        **Successful response `200 OK`:**

        ```json
        {
          "total_pages": 3,
          "number_page": 1,
          "notifications": [
            {
              "id": "uuid",
              "expiration": "2026-05-04 15:30:00",
              "date": "2026-05-04",
              "data": {
                "type": "BUS_DELAY",
                "payload": { "license_plate": "AB123CD", "time_delay": 15, "time_life": 12 }
              }
            }
          ]
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Missing or invalid `terminalID` (role `user`), invalid notification type, dates in the wrong format, `end_date` before `start_date`, or admin with no assigned terminal |
        | `401 Unauthorized` | Missing or invalid token |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_notifications"
      security:
        - bearerAuth: []
      parameters:
        - name: "terminalID"
          in: "query"
          required: false
          description: "Terminal UUID. Required for role `user`; ignored for `admin`/`super_admin`."
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
        - name: "expirated_notifications"
          in: "query"
          required: false
          description: "`true` returns only expired ones; any other value, only current ones."
          schema:
            type: "string"
            enum:
              - "true"
              - "false"
            default: "false"
        - name: "license_plate"
          in: "query"
          required: false
          description: "Filters by license plate (normalized: uppercase, no spaces)."
          schema:
            type: "string"
        - name: "start_date"
          in: "query"
          required: false
          description: "Start date `YYYY-MM-DD`."
          schema:
            type: "string"
            format: "date"
        - name: "end_date"
          in: "query"
          required: false
          description: "End date `YYYY-MM-DD` (>= `start_date`). Ignored without `start_date`."
          schema:
            type: "string"
            format: "date"
        - name: "limit"
          in: "query"
          required: false
          description: "Results per page."
          schema:
            type: "integer"
            minimum: 1
            default: 10
        - name: "offset"
          in: "query"
          required: false
          description: "Offset."
          schema:
            type: "integer"
            minimum: 0
            default: 0
        - name: "notification_type"
          in: "query"
          required: false
          description: "Notification type (case-sensitive)."
          schema:
            $ref: "#/components/schemas/NotificationType"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNotificationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/buses/join:
    post:
      tags:
        - "User"
      summary: "Wait for a bus"
      description: |-
        Leaves the authenticated user waiting for their bus at a terminal. The backend validates the bus ticket against the terminals backend and stores the wait in `awaited_trip`. A user waits for a single trip: if they were already waiting for another one, it is replaced.

        **Authentication:** `Authorization: Bearer {{token}}` (any role).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `terminalId` | string (UUID) | Yes | UUID of the terminal where the passenger waits for the bus |
        | `ticket` | string | Yes | Bus ticket code (e.g. `SUV-226780488-0`). Spaces are trimmed and it is uppercased |

        **Internal behavior:**

        1. Validates `terminalId` (UUID) and `ticket`; otherwise returns `400`.
        2. Checks that the terminal exists; otherwise returns `404`.
        3. Queries `GET /bus_tickets/{ticket}` on the terminals backend; if it does not exist, returns `404`.
        4. Checks that the bus ticket belongs to that terminal (the ticket's `terminal_uuid` == the terminal's `external_terminal_id`); otherwise returns `409`.
        5. Stores the wait with `group_key = PLATE:terminal_uuid` (plate without spaces, uppercase).
        6. Returns the bus ticket data and the `group_key`.

        **Afterwards:** the frontend connects to the realtime hub and invokes `JoinFrontend(group_key)`. When the camera detects the bus (`POST /notify_passengers`, CAMERA collection), the passenger receives `receiveNotification` with `type: BUS_ARRIVAL` (bay and coordinates) and an email.

        **Successful response `201 Created`:**

        ```json
        {
          "group_key": "AF226GU:a0000000-0000-0000-0000-000000000001",
          "terminal": { "uuid": "a0000000-0000-0000-0000-000000000001", "name": "TERMINAL GUALEGUAYCHU" },
          "trip": {
            "postal_code": "3260",
            "bus_terminal_name": "TERMINAL CONCEPCIÓN DEL URUGUAY",
            "terminal_uuid": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
            "ticket": "SUV-226780488-0",
            "dni": "40111222",
            "name": "GONZALO ERRANDONEA",
            "bus_license_plate": "AF226GU",
            "enterprise": "NUEVO EXPRESO",
            "start_date": "2026-09-27T20:00:00",
            "end_date": "2026-09-28T01:30:00",
            "trip_city": [ { "city_name": "GUALEGUAYCHÚ", "start_date": "2026-09-27T21:00:00", "end_date": "2026-09-27T21:15:00", "order": 2 } ],
            "uuid": "3dfad7a5-aafb-4c18-8e03-847687814886"
          },
          "created_at": "2026-09-27T22:12:07.928Z",
          "notified_at": null
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | `terminalId` missing or not a valid UUID, or `ticket` missing |
        | `401 Unauthorized` | Missing or invalid token |
        | `404 Not Found` | Terminal not found or bus ticket not found in the terminals backend |
        | `409 Conflict` | The bus ticket belongs to another terminal (or the terminal has no `external_terminal_id`) |
        | `502 Bad Gateway` | The terminals backend does not respond or returns an error |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_buses_join"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinBusRequest"
            example:
              terminalId: "a0000000-0000-0000-0000-000000000001"
              ticket: "SUV-226780488-0"
      responses:
        "201":
          description: "Wait registered"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwaitedTripResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/buses/awaited:
    get:
      tags:
        - "User"
      summary: "Get awaited trip"
      description: |-
        Returns the trip the authenticated user is waiting for. The frontend uses it when reloading the page to resume waiting (and rejoin the realtime `group_key` group).

        The bus ticket data is queried again from the terminals backend. `notified_at` indicates when the camera detected the bus (`null` if it has not arrived yet).

        **Authentication:** `Authorization: Bearer {{token}}` (any role).

        **Successful response `200 OK`:** same format as `JOIN BUS`.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `404 Not Found` | The user is not waiting for any trip, or the terminal no longer exists / the bus ticket no longer exists in the terminals backend |
        | `502 Bad Gateway` | The terminals backend does not respond |
      operationId: "get_api_buses_awaited"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwaitedTripResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      tags:
        - "User"
      summary: "Stop waiting for the trip"
      description: |-
        The user stops waiting for their trip ("Find another trip" in the frontend). From then on they do not receive the arrival email.

        **Authentication:** `Authorization: Bearer {{token}}` (any role).

        **Successful response:** `204 No Content` (also if they were not waiting for any trip).

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `500 Internal Server Error` | Internal error |
      operationId: "delete_api_buses_awaited"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "No content"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/cities:
    get:
      tags:
        - "Cities"
      summary: "List cities"
      description: |-
        **Roles:** `admin, super_admin`

        Returns the registered cities, paginated and ordered by name.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Body:** None.

        **Query params:**
        | Param | Type | Required | Description |
        |---|---|---|---|
        | `page` | int | No | Page number, starts at 1 (default: `1`) |
        | `limit` | int | No | Items per page (default: `10`, maximum: `100`) |
        | `order` | string | No | `ASC` or `DESC` (default: `DESC`; any other value is treated as `DESC`) |

        **Successful response `200 OK`:**
        ```json
        {
          "cities": [
            { "postal_code": "2820", "name": "GUALEGUAYCHÚ" }
          ],
          "page": 1,
          "next": 2,
          "prev": null,
          "elements": 10,
          "total_elements": 23
        }
        ```

        **Pagination:** `next` and `prev` are the number of the next/previous page, or `null` if there is none. `elements` is the number of items returned in this page and `total_elements` the unpaginated total. Invalid `page`/`limit` values are ignored and the defaults are used.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user does not have role `admin` or `super_admin` |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_cities"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - "Cities"
      summary: "Create city"
      description: |-
        **Roles:** `super_admin`

        Creates a new city in the system.

        **Authentication:** `Authorization: Bearer {{token}}` (**`super_admin` only**: changing cities affects every admin's terminals).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `postal_code` | string | Yes | Unique postal code of the city |
        | `name` | string | Yes | City name (stored in uppercase) |

        **Example:**
        ```json
        {
          "postal_code": "1004",
          "name": "Buenos Aires 1004"
        }
        ```

        **Internal behavior:**
        1. Validates that `postal_code` and `name` are present.
        2. Checks that no city with that `postal_code` exists yet; if it does, returns `409`.
        3. Uppercases the `name` and persists the new city.

        **Successful response `201 Created`:**
        ```json
        {
          "postal_code": "1004",
          "name": "BUENOS AIRES 1004"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body, `postal_code` or `name` missing |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `409 Conflict` | A city with that postal code already exists |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_admin_cities"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
            example:
              postal_code: "1004"
              name: "Buenos Aires 1004"
      responses:
        "201":
          description: "City created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/cities/count:
    get:
      tags:
        - "Cities"
      summary: "Count cities"
      description: |-
        **Roles:** `admin, super_admin`

        Returns the total number of registered cities (equivalent to `total_elements` of `LIST CITIES`).

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Body:** None.

        **Successful response `200 OK`:**
        ```json
        {
          "total": 23
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user does not have role `admin` or `super_admin` |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_cities_count"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/cities/{postal_code}:
    get:
      tags:
        - "Cities"
      summary: "Get city"
      description: |-
        **Roles:** `admin, super_admin`

        Returns the data of a specific city identified by its postal code.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `postal_code` | string | Postal code of the city |

        **Body:** None.

        **Internal behavior:**
        1. Looks up the city by `postal_code` in the database.
        2. If it does not exist returns `404`.

        **Successful response `200 OK`:**
        ```json
        {
          "postal_code": "2820",
          "name": "GUALEGUAYCHÚ"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user does not have role `admin` or `super_admin` |
        | `404 Not Found` | No city exists with that postal code |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_cities_postal_code"
      security:
        - bearerAuth: []
      parameters:
        - name: "postal_code"
          in: "path"
          required: true
          description: "Postal code"
          schema:
            type: "string"
          example: "2820"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "Cities"
      summary: "Update city"
      description: |-
        **Roles:** `super_admin`

        Updates the data of an existing city. Both fields are optional.

        **Authentication:** `Authorization: Bearer {{token}}` (**`super_admin` only**).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `postal_code` | string | Current postal code of the city to update |

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `postal_code` | string | No | New postal code (must be unique) |
        | `name` | string | No | New city name (stored in uppercase) |

        **Example:**

        ```json
        {
          "postal_code": "2821",
          "name": "Buenos Aires - La Plata"
        }
        ```

        **Internal behavior:**

        1. Looks up the city by the path `postal_code`; if it does not exist returns `404`.
        2. Applies the fields present in the body (partial patch). The `name` is uppercased.
        3. If the `postal_code` changes, checks that the new one is not in use; if it already exists returns `409`. Then it updates the name and code in two steps.
        4. If only the `name` changes, it updates directly. An empty body changes nothing and returns the city.

        **Successful response `200 OK`:**

        ```json
        {
          "postal_code": "2821",
          "name": "BUENOS AIRES - LA PLATA"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `404 Not Found` | No city exists with that postal code |
        | `409 Conflict` | The new postal code is already in use |
        | `500 Internal Server Error` | Internal error |
      operationId: "put_api_admin_cities_postal_code"
      security:
        - bearerAuth: []
      parameters:
        - name: "postal_code"
          in: "path"
          required: true
          description: "Current postal code"
          schema:
            type: "string"
          example: "2820"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCityRequest"
            example:
              postal_code: "2821"
              name: "Buenos Aires - La Plata"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - "Cities"
      summary: "Delete city"
      description: |-
        **Roles:** `super_admin`

        Deletes a city from the system identified by its postal code.

        **Authentication:** `Authorization: Bearer {{token}}` (**`super_admin` only**).

        **Path param:**
        | Param | Type | Description |
        |---|---|---|
        | `postal_code` | string | Postal code of the city to delete |

        **Body:** None.

        **Internal behavior:**
        1. Checks that the city with that `postal_code` exists; if it does not exist returns `404`.
        2. Deletes the record from the database.

        **Successful response `204 No Content`:** No body.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The user is not `super_admin` |
        | `404 Not Found` | No city exists with that postal code |
        | `500 Internal Server Error` | Internal error (e.g. the city has associated terminals) |
      operationId: "delete_api_admin_cities_postal_code"
      security:
        - bearerAuth: []
      parameters:
        - name: "postal_code"
          in: "path"
          required: true
          description: "Postal code"
          schema:
            type: "string"
          example: "2820"
      responses:
        "204":
          description: "No content"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/platforms:
    get:
      tags:
        - "Platforms"
      summary: "List platforms grouped by terminal"
      description: |-
        **Roles:** `admin, super_admin`

        Returns the platforms (bays) grouped by terminal, paginated **by terminal**. Terminals are ordered by name and each one's bays by `bay`. Visibility depends on the role.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Query params:**
        | Param | Type | Required | Description |
        |---|---|---|---|
        | `bus_terminal_id` | UUID | No | Filters by a specific terminal (the result is a single terminal) |
        | `page` | int | No | Page number, starts at 1 (default: `1`) |
        | `limit` | int | No | Items per page (default: `10`, maximum: `100`) |
        | `order` | string | No | `ASC` or `DESC` (default: `DESC`; any other value is treated as `DESC`) |

        **Internal behavior by role:**
        - **`super_admin`:** All terminals (or the one given in `bus_terminal_id`; if it does not exist returns `404`).
        - **`admin`:** Only the terminals they manage. If `bus_terminal_id` is passed, checks that the terminal belongs to them; otherwise returns `403`.

        Terminals without bays also appear (with `platforms: []`).

        **Successful response `200 OK`:**
        ```json
        {
          "platforms": [
            {
              "uuid": "a0000000-0000-0000-0000-000000000001",
              "external_terminal_id": "447ab6ac-488a-4ccc-90f1-6ddbf561f6e6",
              "postal_code": "2820",
              "name": "TERMINAL GUALEGUAYCHU",
              "platforms": [
                { "code": 1, "bay": "A1", "coordinates": { "lat": -34.6037, "lng": -58.3816 } }
              ]
            }
          ],
          "page": 1,
          "next": null,
          "prev": null,
          "elements": 1,
          "total_elements": 1
        }
        ```

        **Pagination:** `next` and `prev` are the number of the next/previous page, or `null` if there is none. `elements` is the number of items returned in this page and `total_elements` the unpaginated total. Invalid `page`/`limit` values are ignored and the defaults are used. `elements` and `total_elements` count terminals, not bays.

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | `bus_terminal_id` with an invalid format |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The admin does not own that terminal |
        | `404 Not Found` | Terminal not found |
        | `500 Internal Server Error` | Internal error |
      operationId: "get_api_admin_platforms"
      security:
        - bearerAuth: []
      parameters:
        - name: "bus_terminal_id"
          in: "query"
          required: false
          description: "Filters by a specific terminal."
          schema:
            type: "string"
            format: "uuid"
          example: "a0000000-0000-0000-0000-000000000001"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPlatformsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - "Platforms"
      summary: "Create platform"
      description: |-
        **Roles:** `admin, super_admin`

        Creates a new platform (bay) associated with a terminal.

        **Authentication:** `Authorization: Bearer {{token}}` (role `admin` or `super_admin`).

        **Body (JSON):**
        | Field | Type | Required | Description |
        |---|---|---|---|
        | `bay` | string | Yes | Bay identifier (e.g. `"A20"`). Spaces are trimmed and it is uppercased; only letters, numbers and `-` |
        | `coordinates` | object | No | Geographic coordinates `{ "lat": float, "lng": float }` (stored as JSON as-is) |
        | `bus_terminal_id` | UUID | Yes | UUID of the terminal the bay belongs to |

        **Example:**
        ```json
        {
          "bay": "A20",
          "coordinates": { "lat": -34.6037, "lng": -58.3816 },
          "bus_terminal_id": "a0000000-0000-0000-0000-000000000001"
        }
        ```

        **Internal behavior:**
        1. Normalizes and validates `bay`; if it is empty or has invalid characters returns `400`.
        2. Depending on the role:
           - **`super_admin`:** checks that the terminal exists (`404`).
           - **`admin`:** checks that the terminal belongs to them (`403`, also if it does not exist).
        3. Creates the platform; the `code` is assigned by the database.

        **Successful response `201 Created`:**
        ```json
        {
          "code": 21,
          "bay": "A20",
          "coordinates": { "lat": -34.6037, "lng": -58.3816 },
          "bus_terminal_id": "a0000000-0000-0000-0000-000000000001"
        }
        ```

        **Errors:**
        | Code | Cause |
        |---|---|
        | `400 Bad Request` | Malformed body, `bay` empty or with invalid characters |
        | `401 Unauthorized` | Missing or invalid token |
        | `403 Forbidden` | The admin does not own that terminal |
        | `404 Not Found` | Terminal not found (`super_admin`) |
        | `500 Internal Server Error` | Internal error |
      operationId: "post_api_admin_platforms"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlatformRequest"
            example:
              bay: "A20"
              coordinates:
                lat: -34.6037
                lng: -58.3816
              bus_terminal_id: "a0000000-0000-0000-0000-000000000001"
      responses:
        "201":
          description: "Platform created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/platforms/count:
