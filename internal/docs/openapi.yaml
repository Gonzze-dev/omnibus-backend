        terminal_uuid:
          type: "string"
          format: "uuid"
        ticket:
          type: "string"
          example: "SUV-226780488-0"
        dni:
          type: "string"
          example: "40111222"
        name:
          type: "string"
          example: "GONZALO ERRANDONEA"
        bus_license_plate:
          type: "string"
          example: "AF226GU"
        enterprise:
          type: "string"
          example: "NUEVO EXPRESO"
        start_date:
          type: "string"
          example: "2026-09-27T20:00:00"
        end_date:
          type: "string"
          example: "2026-09-28T01:30:00"
        trip_city:
          type: "array"
          items:
            $ref: "#/components/schemas/TripCity"
        uuid:
          type: "string"
          format: "uuid"
    JoinBusRequest:
      type: "object"
      properties:
        terminalId:
          type: "string"
          format: "uuid"
        ticket:
          type: "string"
          description: "Bus ticket code (uppercased)"
      required:
        - "terminalId"
        - "ticket"
    AwaitedTripResponse:
      type: "object"
      properties:
        group_key:
          type: "string"
          description: "`PLATE:terminal_uuid`, for `JoinFrontend` on the realtime hub"
          example: "AF226GU:a0000000-0000-0000-0000-000000000001"
        terminal:
          $ref: "#/components/schemas/TerminalRef"
        trip:
          $ref: "#/components/schemas/BusTicket"
        created_at:
          type: "string"
          format: "date-time"
        notified_at:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the camera detected the bus"
      required:
        - "group_key"
        - "terminal"
        - "trip"
        - "created_at"
        - "notified_at"
    NotificationItem:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        expiration:
          type: "string"
          example: "2026-05-04 15:30:00"
        date:
          type: "string"
          example: "2026-05-04"
        data:
          type: "object"
          additionalProperties: true
          description: "Notification payload (without the internal `id`)"
      required:
        - "id"
        - "expiration"
        - "date"
        - "data"
    GetNotificationsResponse:
      type: "object"
      properties:
        total_pages:
          type: "integer"
        number_page:
          type: "integer"
        notifications:
          type: "array"
          items:
            $ref: "#/components/schemas/NotificationItem"
      required:
        - "total_pages"
        - "number_page"
        - "notifications"
    AdminNotification:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        type:
          $ref: "#/components/schemas/NotificationType"
        terminal:
          type: "object"
          allOf:
            - $ref: "#/components/schemas/TerminalRef"
          nullable: true
          description: "`null` in GLOBAL notifications"
        date:
          type: "string"
          format: "date-time"
        expiration:
          type: "string"
          format: "date-time"
        expired:
          type: "boolean"
        payload:
          type: "object"
          additionalProperties: true
      required:
        - "id"
        - "type"
        - "terminal"
        - "date"
        - "expiration"
        - "expired"
        - "payload"
    ListAdminNotificationsResponse:
      type: "object"
      properties:
        notifications:
          type: "array"
          items:
            $ref: "#/components/schemas/AdminNotification"
        page:
          type: "integer"
          example: 1
        next:
          type: "integer"
          nullable: true
          description: "Next page or `null` if it is the last one"
          example: 2
        prev:
          type: "integer"
          nullable: true
          description: "Previous page or `null` if it is the first one"
          example: null
        elements:
          type: "integer"
          description: "Number of items in this page"
          example: 10
        total_elements:
          type: "integer"
          format: "int64"
          description: "Unpaginated total"
          example: 23
      required:
        - "notifications"
        - "page"
        - "next"
        - "prev"
        - "elements"
        - "total_elements"
    NotificationTypesResponse:
      type: "object"
      properties:
        types:
          type: "array"
          items:
            $ref: "#/components/schemas/NotificationType"
      required:
        - "types"
      example:
        types:
          - "LOCAL"
          - "BUS_DELAY"
          - "BUS_ARRIVAL"
    AdminSendNotificationRequest:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
            - "LOCAL"
            - "GLOBAL"
        payload:
          type: "object"
          properties:
            message:
              type: "string"
            time_life:
              type: "integer"
              minimum: 1
              description: "Lifetime in minutes"
          required:
            - "message"
            - "time_life"
          additionalProperties: true
          description: "In GLOBAL extra fields are accepted and forwarded as-is"
      required:
        - "type"
        - "payload"
    NotifyBusDelayRequest:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
            - "BUS_DELAY"
        license_plate:
          type: "string"
          example: "AB 123 CD"
        uuid_terminal:
          type: "string"
          format: "uuid"
          description: "Required for `super_admin` and for `admin` with more than one terminal"
        start_date:
          type: "string"
          format: "date"
          description: "Trip date `YYYY-MM-DD`"
        payload:
          type: "object"
          properties:
            time_delay:
              type: "integer"
              minimum: 1
              description: "Delay in minutes"
            time_life:
              type: "integer"
              minimum: 1
              description: "Lifetime in minutes"
          required:
            - "time_delay"
            - "time_life"
      required:
        - "type"
        - "license_plate"
        - "start_date"
        - "payload"
    NotifyPassengersRequest:
      type: "object"
      properties:
        license_plate:
          type: "string"
          description: "License plate (normalized: uppercase, no spaces)"
        code:
          type: "string"
          pattern: "^[0-9]+$"
          description: "Numeric code of the bay"
        time_life:
          type: "integer"
          minimum: 1
          description: "Lifetime in minutes"
      required:
        - "license_plate"
        - "code"
        - "time_life"
    CameraErrorPayload:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        message:
          type: "string"
        time_life:
          type: "integer"
          minimum: 1
      required:
        - "message"
        - "time_life"
    CameraErrorRequest:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
            - "CAMERA"
        code_camera:
          type: "string"
          pattern: "^[0-9]+$"
          description: "Numeric code of the bay"
        payload:
          $ref: "#/components/schemas/CameraErrorPayload"
      required:
        - "type"
        - "code_camera"
        - "payload"
    CameraErrorResponse:
      type: "object"
      properties:
        type:
          $ref: "#/components/schemas/NotificationType"
        payload:
          $ref: "#/components/schemas/CameraErrorPayload"
      required:
        - "type"
        - "payload"
    LicensePlateResponse:
      type: "object"
      properties:
        license_plate:
          type: "string"
          example: "AF226GU"
      required:
        - "license_plate"
